[project]
name = "homebandhu-backend"
version = "0.1.0"
description = "HomeBandhu backend — FastAPI service over Supabase (Postgres, Auth, Storage)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase==2.31.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    # Standards Web Push (RFC 8291/8292) with our own VAPID keypair, so no
    # vendor SDK reaches the frontend and no third party sees who visited which
    # flat. A runtime dependency, not a dev one: the push sender is part of the
    # running service. Brings `py-vapid`, which scripts/generate_vapid_keys.py
    # uses. See docs/design/RESIDENT_BACKEND_DESIGN.md 5.11.
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    # scripts/export_openapi.py, which regenerates docs/openapi.yaml. A dev
    # dependency on purpose: the running service never reads or writes YAML.
    "pyyaml>=6.0",
    # The real PostgreSQL parser. supabase/migrations/README.md claims every
    # migration is checked with it, so it has to be installable from this file
    # rather than from whoever happened to run the check last.
    "pglast>=6.0",
]

[tool.uv]
required-version = ">=0.11.32"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# B008: calling Depends() in argument defaults is the intended FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
