      security:
      - HTTPBearer: []
      summary: Public key for PushManager.subscribe
      tags:
      - push
      x-no-user-story:
        api-type: Non-functional
        rationale: 'Web Push plumbing: handing the browser the application server key and storing what
          PushManager.subscribe hands back. A resident experiences US-2.1 and US-2.4; nobody experiences
          a VAPID key. See RESIDENT_BACKEND_DESIGN.md 10.5.'
