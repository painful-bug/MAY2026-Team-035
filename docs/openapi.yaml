          maxLength: 200
          title: Location
          type: string
        priority:
          default: Low
          title: Priority
          type: string
        skillId:
          anyOf:
          - type: string
          - type: 'null'
          title: Skillid
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
