          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_BookingSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Approve a booking request
      tags:
      - amenities
  /api/v1/amenity-bookings/{series_id}/reject:
    post:
      description: 'Reject a whole request and release its slots.


        ``reasonCode`` is required and ``other`` must carry free text: a rejection

        with neither is an unanswerable support ticket, which is why the database

        refuses it as well. Returns 409 if the request has already been decided.'
      operationId: reject_booking_api_v1_amenity_bookings__series_id__reject_post
      parameters:
      - in: path
        name: series_id
        required: true
        schema:
          title: Series Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectBookingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_BookingSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Reject a booking request
      tags:
      - amenities
  /api/v1/amenity-reports:
    get:
      description: 'The reports page.


        ``rows`` is a page, because a table renders a page. ``kpis`` is a database

        aggregate over **every** matching row, because a KPI that describes one page

        is not a KPI -- and this one is labelled "Total Revenue".


        ``options.bookingStatuses`` is the lifecycle''s fixed vocabulary rather than

        the statuses that happen to be present, so the filter does not lose an option

        the moment nothing currently has that status.'
