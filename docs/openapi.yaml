          type: boolean
        isPrivate:
          default: false
          title: Isprivate
          type: boolean
        isUpcoming:
          title: Isupcoming
          type: boolean
        notes:
          default: ''
          title: Notes
          type: string
        outstandingAmount:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Outstandingamount
          type: string
        rejectionReason:
          default: ''
          title: Rejectionreason
          type: string
        startsAt:
          format: date-time
          title: Startsat
          type: string
        status:
          title: Status
          type: string
        storedStatus:
          title: Storedstatus
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        totalAmount:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Totalamount
          type: string
