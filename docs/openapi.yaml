      type: object
    RaiseComplaintRequest:
      description: 'What the resident''s complaint form collects.


        ``expectedResolutionAt`` is **not** a field here, though the form computes

        one. The SLA is a product rule and it is applied in the database (§3.3,

        §5.3); accepting it from the client would let a resident send themselves a

        one-minute deadline and would leave the admin''s ``dueAt`` and the resident''s

        expectation as two independent numbers.


        Attachments are not accepted yet. The form collects them, ``media`` exists in

        the baseline, and no upload endpoint does -- so this backend takes what it

        can honour and the gap is stated in ``API.md`` rather than half-built.'
      properties:
        category:
          maxLength: 80
          minLength: 1
          title: Category
          type: string
        description:
          default: ''
          maxLength: 4000
          title: Description
          type: string
        location:
          default: ''
          maxLength: 200
          title: Location
          type: string
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        urgency:
          default: Low
          title: Urgency
          type: string
      required:
      - title
      - category
      title: RaiseComplaintRequest
      type: object
    RecordAmenityPaymentRequest:
      description: '``paymentReference`` makes this idempotent: a replayed gateway callback

        returns the event already recorded rather than double-crediting.'
      properties:
        amount:
          exclusiveMinimum: 0.0
          title: Amount
          type: number
        chargeType:
          default: booking
          title: Chargetype
