          title: Amenity Id
          type: string
      - description: paid | pending | partially_paid | refund_pending | refunded | cancelled | all
        in: query
        name: paymentStatus
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: paid | pending | partially_paid | refund_pending | refunded | cancelled | all
          title: Paymentstatus
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Q
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_LedgerTransaction_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List an amenity's financial transactions
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}/ledger/summary:
    get:
      description: 'The eight cards above the ledger table.


        Aggregated by Postgres over every transaction for the amenity, so the figures

        do not change when the table is paged. An amenity nobody has booked reports

        zeros with HTTP 200, never a 404.'
      operationId: get_ledger_summary_api_v1_amenities__amenity_id__ledger_summary_get
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Amenity ledger totals
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}/status:
    patch:
      description: 'The availability toggle on the card.


        Its own route rather than a partial update, because the toggle sends one

        boolean and routing it through a twelve-field patch is how a toggle ends up

        blanking a description.'
      operationId: set_amenity_status_api_v1_amenities__amenity_id__status_patch
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenityStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Activate or deactivate an amenity
      tags:
      - amenities
  /api/v1/amenity-bookings/cancel:
    post:
      description: 'Cancel one or more days of a request.


        Serves residents and admins from one route. A resident may withdraw their own

        **future** days; an admin may cancel any. Which of the two you are is read

        from your token, so there is nothing in the body to lie about.


        All-or-nothing: if any selected day cannot be cancelled the whole call

        returns 409, rather than cancelling four of five and reporting success.'
      operationId: cancel_bookings_api_v1_amenity_bookings_cancel_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Cancel selected booking days
      tags:
      - amenities
  /api/v1/amenity-bookings/{occurrence_id}/charges:
    post:
      description: 'Bill something after the fact -- housekeeping, or a late-cancellation fee.


        A second charge of the same kind **adds** to the first: the ledger has one

        ``additionalCharges`` figure, and housekeeping on Monday plus a broken chair

        on Tuesday is two things, not the later one.'
      operationId: add_charge_api_v1_amenity_bookings__occurrence_id__charges_post
      parameters:
      - in: path
        name: occurrence_id
        required: true
        schema:
          title: Occurrence Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChargeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransaction'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Add a charge to a booking
      tags:
      - amenities
  /api/v1/amenity-bookings/{occurrence_id}/damage:
    post:
      description: 'Take damage out of the held deposit.


        Capped at what is left, and capped in Postgres rather than here: a deduction

        larger than the deposit is not a deduction, it is an invoice, and it would

        drive ``remainingRefund`` negative -- which the ledger clamps to zero, quietly

        hiding the error. Returns 409 instead. A reason is required.'
      operationId: deduct_damage_api_v1_amenity_bookings__occurrence_id__damage_post
      parameters:
      - in: path
        name: occurrence_id
        required: true
        schema:
          title: Occurrence Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DamageDeductionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransaction'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Deduct damage from a booking deposit
      tags:
      - amenities
  /api/v1/amenity-bookings/{occurrence_id}/force-cancel:
    post:
      description: 'Override a booking the resident still wants.


        Distinct from an ordinary cancellation because the ledger records who did it

        and why, and because the deposit becomes refundable as a result -- which the

        ledger derives rather than being told. Returns 409 unless the booking is

        approved or confirmed.'
      operationId: force_cancel_booking_api_v1_amenity_bookings__occurrence_id__force_cancel_post
      parameters:
      - in: path
        name: occurrence_id
        required: true
        schema:
          title: Occurrence Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceCancelRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Force-cancel a booking
      tags:
      - amenities
  /api/v1/amenity-bookings/{occurrence_id}/payments:
    post:
      description: 'Record money received against one charge -- the booking fee or the deposit.


        Idempotent on ``paymentReference``: a replayed gateway callback returns the

        event already recorded rather than double-crediting. Overpayment returns 409

        rather than being clamped, because clamping accepts money and then loses it.'
      operationId: record_payment_api_v1_amenity_bookings__occurrence_id__payments_post
      parameters:
      - in: path
        name: occurrence_id
        required: true
        schema:
          title: Occurrence Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAmenityPaymentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransaction'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Record a payment against a booking
      tags:
      - amenities
  /api/v1/amenity-bookings/{occurrence_id}/refund:
    post:
      description: 'Return what is left of the deposit.


        **The amount is not a parameter.** It is the deposit paid, less damage taken,

        less anything already refunded, computed in Postgres -- a refund whose amount

        the caller chooses is a refund somebody can ask to be larger. Returns 409

        while the booking is still ahead of it, or once nothing is left.'
      operationId: refund_deposit_api_v1_amenity_bookings__occurrence_id__refund_post
      parameters:
      - in: path
        name: occurrence_id
        required: true
        schema:
          title: Occurrence Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundDepositRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransaction'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Refund a booking deposit
      tags:
      - amenities
  /api/v1/amenity-bookings/{series_id}/approve:
    post:
      description: 'Approve a whole request -- every day of it.


        Days the resident already withdrew keep their cancellation: approving should

        not resurrect a day somebody said they no longer wanted. Returns 409 if the

        request has already been decided.'
      operationId: approve_booking_api_v1_amenity_bookings__series_id__approve_post
      parameters:
      - in: path
        name: series_id
        required: true
        schema:
          title: Series Id
          type: string
      responses:
