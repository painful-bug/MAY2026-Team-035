  /api/v1/departments/{department_id}/triage-snapshot:
    get:
      description: "Six sections, bucketed server-side, newest first within each.\n\n* `newComplaints`\
        \ — storage status `open`, no take-up stamp, no live job.\n* `takenUp` — a supervisor pressed\
        \ *Take up* and no job exists yet.\n* `awaitingResident` — the resident has been asked and has\
        \ not answered:\n  `awaiting_resident`, uncommitted. Nothing here is the supervisor's to\n  move,\
        \ which is why it stopped being an open request on 2026-08-23.\n* `openRequests` — a job is raised\
        \ and nobody has committed to it: `draft`\n  or `offered`.\n* `assignedPending` — a worker **accepted**\
        \ it (or it is booked) and has not\n  started.\n* `inProgress` — the worker pressed *Start*; `startedAt`\
        \ says when.\n\n**The bucketing is the server's and the client never re-derives it.** *Live*\n\
        (not completed, cancelled or failed) and *committed* (an `accepted`\nassignment, or work-order\
        \ status `scheduled`) are defined once, in\n`supervisor_triage_snapshot`. Six definitions that\
        \ must agree are one\ndefinition or they are six answers.\n\n**Furthest stage wins**, so a complaint\
        \ appears exactly once across the six:\nas a complaint until a job exists, and as that job afterwards.\
        \ An offered but\nunaccepted job is an *open request* and not assigned work — the 2026-08-22\n\
        ruling A3, and the reason `offeredToName` exists beside `assigneeName`.\n\nOne call rather than\
        \ the N+1 the triage screen makes today — a department\nread followed by a work-order read per\
        \ complaint, which four sections would\nhave multiplied by four.\n\n| Status | Code | Cause |\n\
        |---|---|---|\n| 403 | `forbidden` | You do not supervise this department |\n| 404 | `not_found`\
        \ | No such department |"
      operationId: triage_snapshot_api_v1_departments__department_id__triage_snapshot_get
      parameters:
      - description: Department id, scoped to the caller's community.
        in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageSnapshot'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: The supervisor's dashboard, in one read
      tags:
      - supervisor-triage
      x-no-user-story:
        api-type: Feature
        rationale: 'The supervisor''s machinery for turning a triaged complaint into a scheduled visit:
          the queue, the job record, the edit and the assignment history. Three operations on this surface
          DO serve stories -- proposing a time, assigning a person and moving or cancelling a visit all
          reach the resident -- and these do not, which is the distinction worth keeping. The interviews
          produced ''nobody tells me what is happening''; they did not produce a work queue. What a resident
          learns from this machinery arrives through `GET /complaints`, the timeline and the schedule
          request, and claiming US-2.8 for a screen only the department can open would make the matrix
          say a resident sees something they cannot.'
        status: Not covered by user story
      x-user-stories: []
