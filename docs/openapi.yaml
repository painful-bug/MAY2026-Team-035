  /api/v1/invitations/prepare:
    post:
      description: 'Resolve an invitation link or code and stage it for redemption.


        Unauthenticated by design -- the recipient has not signed in yet. Accepts exactly one of `token`
        or `code`; both or neither is **422**. On success the invitation id is stored in a signed five-minute
        cookie, so the id never crosses the browser in a form the recipient could edit before `redeem`.'
      operationId: prepare_invitation_api_v1_invitations_prepare_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareInvitationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Successful Response
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Prepare Invitation
      tags:
      - invitations
      x-no-user-story:
