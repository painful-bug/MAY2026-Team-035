        timezone:
          anyOf:
          - maxLength: 64
            minLength: 3
            type: string
          - type: 'null'
          title: Timezone
        unitLabelSingular:
          anyOf:
          - maxLength: 24
            type: string
          - type: 'null'
          title: Unitlabelsingular
        visitorCodeTtlMinutes:
          anyOf:
          - maximum: 1440.0
            minimum: 5.0
            type: integer
          - type: 'null'
          title: Visitorcodettlminutes
