        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Q
      - description: UPI | Credit Card | Net Banking | Cash | Cheque | Bank Transfer
        in: query
        name: method
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: UPI | Credit Card | Net Banking | Cash | Cheque | Bank Transfer
          title: Method
      - in: query
        name: invoiceId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoiceid
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_PaymentSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List payments
      tags:
      - money
  /api/v1/registrations:
    get:
      description: Self-signup requests awaiting review, newest first.
      operationId: list_registrations_api_v1_registrations_get
      parameters:
      - description: Which requests to return.
        in: query
        name: status
        required: false
        schema:
          default: pending
          description: Which requests to return.
          pattern: ^(pending|approved|rejected)$
          title: Status
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RegistrationRequestSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List registration requests
      tags:
      - people
  /api/v1/registrations/{request_id}/approve:
    post:
      description: 'Approve a request and mint the applicant''s invitation, atomically.


        **Approval does not create an active account.** It issues an invite the

        applicant redeems, because the invite token is a mandatory second factor.

        The returned ``link`` and ``code`` are shown once and are not recoverable.


        201 rather than 200: this creates an invitation.'
      operationId: approve_registration_api_v1_registrations__request_id__approve_post
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedRegistration'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Approve a registration request
      tags:
      - people
  /api/v1/registrations/{request_id}/reject:
    post:
      description: Reject a pending request. The applicant may apply again.
      operationId: reject_registration_api_v1_registrations__request_id__reject_post
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RejectRegistrationRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Reject a registration request
      tags:
      - people
  /api/v1/residents:
    get:
      description: 'Page through the community''s residents.


        Returns ``{"items": [], "total": 0}`` with HTTP 200 when there are none --

        never a 404, so the frontend has one shape to render either way.'
      operationId: list_residents_api_v1_residents_get
      parameters:
      - description: Matches name, flat code or phone.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Matches name, flat code or phone.
          title: Search
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ResidentSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List residents
      tags:
      - dashboard
  /api/v1/residents/{membership_id}:
    delete:
      description: 'Deactivate a resident and end their residency.


        **This is not a delete.** Complaints, invoices and payments reference the

        membership; removing the row would either cascade them away or fail outright.

        The member stops appearing in active lists and the flat reads as vacant.


        Returns 409 if an admin tries to remove their own membership -- there is no

        recovery path from locking a community out of its own dashboard.'
      operationId: remove_resident_api_v1_residents__membership_id__delete
      parameters:
      - in: path
        name: membership_id
        required: true
        schema:
          title: Membership Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Remove a resident
      tags:
      - people
    patch:
      description: Patch a resident's editable fields. Omitted fields are left unchanged.
      operationId: update_resident_api_v1_residents__membership_id__patch
      parameters:
      - description: The membership id, not the profile id.
        in: path
        name: membership_id
        required: true
        schema:
          description: The membership id, not the profile id.
          title: Membership Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResidentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update a resident
      tags:
      - people
  /api/v1/settings:
    get:
      description: 'Everything the settings screen needs, in one request.


        ``hasSavedSettings`` is ``false`` for a community that has never saved. The

        values are then defaults rather than choices, and rendering the two the same

        way tells an admin they picked a timezone they have never seen.'
      operationId: get_settings_api_v1_settings_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSnapshot'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: The community settings snapshot
      tags:
      - settings
    put:
      description: 'Patch the community preferences. Omitted fields are left unchanged.


        ``unitLabelSingular: null`` clears the override and goes back to deriving the

        word from the community type, which is not what omitting the field does.'
      operationId: update_settings_api_v1_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSnapshot'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Patch the community preferences
      tags:
      - settings
  /api/v1/settings/modules:
    get:
      description: 'The ten feature modules and this community''s setting for each.


        **Any authenticated role**, unlike the rest of this file: if module state ever

        gates navigation then every shell needs it, and a resident learning the

        marketplace is off discloses nothing.


        ``backendStatus`` is the field worth rendering. Six of the ten modules have no

        backend at all, so without it an admin can switch on Parking Management and

        be given no hint that nothing will happen. ``enabledWithoutBackend`` is that

        count.'
      operationId: list_modules_api_v1_settings_modules_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCollection'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List the feature modules
      tags:
      - settings
    put:
      description: 'Set the whole module set from the list of keys that should be on.


        The shape the onboarding wizard already produces: ``enabledModules`` is the

        array of enabled keys, and every other key is off by omission. Every key is

        validated before anything is written, so one typo does not leave a community

        half-configured.


        An empty array is legitimate and turns everything off. A missing field is a

        `422` rather than the same thing, because a caller who forgot it would

        otherwise disable the whole product by accident.'
      operationId: replace_modules_api_v1_settings_modules_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceModulesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCollection'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Replace the whole module set
      tags:
      - settings
  /api/v1/settings/modules/{moduleKey}:
    patch:
      description: 'Turn one module on or off.


        One key at a time so two admins toggling two different modules in the same

        minute do not undo each other -- which is what a whole-set write does.'
      operationId: set_module_api_v1_settings_modules__moduleKey__patch
      parameters:
      - description: A catalogue key such as `amenities-booking`. Unknown keys 404.
        in: path
        name: moduleKey
        required: true
        schema:
          description: A catalogue key such as `amenities-booking`. Unknown keys 404.
          maxLength: 64
          title: Modulekey
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleToggleRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Toggle one feature module
      tags:
      - settings
  /health:
    get:
      description: Liveness probe.
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
      tags:
      - system
servers:
- description: Local development
  url: http://localhost:8000
- description: Deployed
  url: https://{host}
  variables:
    host:
      default: api.homebandhu.example
      description: API host
tags:
- description: Sign-in, token refresh and the caller's own profile.
  name: auth
- description: Admin-issued invites and their redemption.
  name: invitations
- description: Admin dashboard tiles, community profile and residents.
  name: dashboard
- description: Admins and the registration review queue.
  name: people
- description: Complaints, their timeline, comments and attachments.
  name: complaints
- description: Departments, staff rosters and complaint categories.
  name: departments
