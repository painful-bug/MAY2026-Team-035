  /api/v1/complaints:
    get:
      description: 'The caller''s own complaints, newest first.


        **Always the caller''s own, whatever their role.** An admin calling this gets

        the complaints they personally raised, not the community queue — that is

        `GET /dashboard/snapshot`. One route that returns a resident''s list to one

        caller and the whole association''s to another is the shape §5.1 exists to

        prevent.


        An unrecognised `status` is a `422`, not an empty page: a filter typo must

        not be indistinguishable from *you have no resolved complaints*.


        `status` matches on what a complaint **displays as**, not on one stored

        value. Two stored statuses render as `Resolved` and two as `In Progress`, so

        filtering by the word shown in the list returns every row the list shows

        under it.'
      operationId: list_my_complaints_api_v1_complaints_get
      parameters:
      - description: '`Pending` | `In Progress` | `Resolved` | `Cancelled`.'
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`Pending` | `In Progress` | `Resolved` | `Cancelled`.'
          title: Status
      - description: Exact category match.
        in: query
        name: category
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact category match.
          title: Category
      - description: Only complaints with unseen changes.
        in: query
        name: unread
        required: false
        schema:
          default: false
          description: Only complaints with unseen changes.
          title: Unread
          type: boolean
      - description: 1-based page number.
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - description: Rows per page. The maximum differs per endpoint; see the schema.
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ComplaintSummary_'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: List my complaints
      tags:
      - complaints
      x-user-stories:
      - coverage: served
        id: US-2.6
        role: The list the story's tracking starts from -- status, progress and expected resolution on
          every row, so following a complaint stops meaning calling about it
        title: Complaint status tracking with history
      - coverage: served
        id: US-2.8
        role: assignee and expectedResolutionAt reach the resident here for the first time. Both were
          already stored; the snapshot projection dropped them, which is why the story read Partial
        title: Complaint accountability
    post:
      description: 'File a complaint against the caller''s own membership.


        **The expected resolution time is computed here, not sent.** High → 24h,

        Medium → 48h, Low → 72h, applied by the database on insert. The rule used to

        live in a store slice, where a resident could have sent themselves a

        one-minute deadline and where the admin portal could not see it at all.


        Raising a complaint notifies every active admin and manager of the

        community — the first write in this backend to emit a notification, and the

        reason the notification substrate was built before this step.


        Attachments are **not** accepted yet. The form collects them and no upload

        endpoint exists; sending them would be accepting data this backend then

        drops.'
      operationId: raise_complaint_api_v1_complaints_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseComplaintRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Raise a complaint
      tags:
      - complaints
      x-user-stories:
      - coverage: served
        id: US-2.5
        role: The create endpoint the story records as missing, with the priority selector writing to
          a real column
        title: Simple complaint submission with priority
      - coverage: served
        id: US-2.8
        role: The expected resolution time is computed on insert from that priority, so it exists before
          anyone asks for it
        title: Complaint accountability
  /api/v1/complaints/{complaint_id}:
    get:
      description: 'One complaint with its timeline and public comment thread.


        A complaint that exists but belongs to someone else is a `404`, identical to

        one that does not exist. The lookup filters on the membership rather than

        checking afterwards, so there is no code path in which the two could be

        told apart by response time or shape.


        **Internal comments never appear here.** The RLS policy in `0031` is what

        makes that true — the row does not arrive, so no later refactor of this API

        can accidentally include it. The repository also filters on `visibility`,

        which changes nothing about what is returned and makes the rule visible to

        someone reading the query rather than the policy.


        The timeline and the thread are bounded. When a complaint has more history

        than fits, the **recent** end is what is kept and `hasOlderEvents` /

        `hasOlderComments` say so — a bounded read that reports completeness it

        never checked is the one kind of truncation a client cannot detect.'
      operationId: get_complaint_api_v1_complaints__complaint_id__get
      parameters:
      - description: Complaint id, scoped to the caller's community.
        in: path
        name: complaint_id
        required: true
        schema:
          title: Complaint Id
          type: string
      responses:
        '200':
          content:
