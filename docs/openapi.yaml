    ResidentSnapshot:
      description: 'One read for the resident home screen.


        Deliberately **not** `/dashboard/snapshot` with a role branch (§5.1). An

        admin wants counts across the community and a resident wants *their* dues,

        *their* visitors, *their* complaints; a single payload whose shape depends on

        a runtime role is one `if` away from leaking a community-wide count into a

        resident''s response.


        ``activity`` is the caller''s notification feed rather than a second event

        log — see the service for why, and for the disagreement with §5.7 that

        choice records.'
      properties:
        activity:
          default: []
          items:
            $ref: '#/components/schemas/NotificationItem'
          title: Activity
          type: array
        complaints:
          $ref: '#/components/schemas/ComplaintDigest'
          default:
            recent: []
            total: 0
        dues:
          $ref: '#/components/schemas/DuesDigest'
          default:
            currencyCode: INR
            isPartialTotal: false
            outstandingTotal: '0'
            unpaidCount: 0
        generatedAt:
          format: date-time
          title: Generatedat
          type: string
        notices:
          default: []
          items:
            $ref: '#/components/schemas/Notice'
          title: Notices
          type: array
        unreadNotifications:
          default: 0
          title: Unreadnotifications
          type: integer
        visitors:
          $ref: '#/components/schemas/VisitorDigest'
          default:
            checkedInGuests: 0
            expectedGuests: 0
            pendingApproval: []
            pendingCount: 0
      required:
      - generatedAt
      title: ResidentSnapshot
      type: object
    SessionContext:
