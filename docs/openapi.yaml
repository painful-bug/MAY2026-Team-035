components:
  responses:
    Conflict:
      content:
        application/json:
          example:
            error:
              code: conflict
              message: That member is already an administrator.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: 'The request is well-formed but disagrees with current state: a duplicate, or a transition
        the resource''s status does not allow. Retrying without changing something will fail identically.'
    Forbidden:
      content:
        application/json:
          example:
            error:
              code: community_role_required
              message: You do not have permission for this community action.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: 'Authenticated, but not permitted. Three distinct causes share this status: the community
        role is insufficient (`community_role_required`), there is no active membership (`active_membership_required`),
        or the CSRF pair failed (`csrf_invalid`, `csrf_origin_invalid`). Retrying helps only in the last
        case, and only after re-fetching `GET /auth/csrf`.'
    InternalServerError:
      content:
        application/json:
          example:
            error:
              code: internal_error
              message: An unexpected error occurred.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: 'An unhandled exception. Logged in full server-side and deliberately opaque here: no
        message, stack or query ever reaches the caller.'
    NotFound:
      content:
        application/json:
          example:
            error:
              code: not_found
              message: Department not found.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The addressed resource does not exist, or is not visible to this caller -- the two
        are deliberately indistinguishable, so that a 404 never confirms the existence of another community's
        data.
    ServiceUnavailable:
      content:
        application/json:
          example:
            error:
              code: service_unavailable
              message: The authentication provider did not respond in time. Please try again.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: A dependency this call needs -- Supabase Auth, or a Postgres object that has not been
        provisioned -- did not answer. Transient; retry with backoff.
    Unauthorized:
      content:
        application/json:
          example:
            error:
              code: authentication_error
              message: Missing bearer token.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: No credentials, or credentials that no longer verify. The caller should refresh the
        session and retry once, then sign in again.
    UnprocessableEntity:
      content:
        application/json:
          example:
            error:
              code: request_validation_error
              details:
              - field: body.email
                message: value is not a valid email address
              message: The request could not be validated.
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The request could not be validated. `request_validation_error` is a schema failure
        and carries `details[]`; every other code here is a business rule that a well-typed request can
        still break.
