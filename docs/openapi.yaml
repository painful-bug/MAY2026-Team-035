  /api/v1/invoices:
    post:
      description: 'Issue one invoice against one flat.


        The invoice, its line items and its number are written in one transaction,

        and the totals are computed from the lines -- so a header that disagrees with

        its own contents cannot be submitted.


        The flat is identified by ``unitId`` or by ``flat`` (``B-1204``), and is

        created on first reference. Returns 409 when the lines total zero or the due

        date precedes the issue date.'
      operationId: create_invoice_api_v1_invoices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Issue an invoice
      tags:
      - money
      x-user-stories:
      - coverage: partial
        id: US-1.6
        role: Creates the maintenance billing rows the reports aggregate
        title: Automated administrative reports
  /api/v1/invoices/{invoice_id}/payments:
    post:
      description: 'Record money received against an invoice and return the settled invoice.


        **Idempotent on ``reference``.** Sending the same reference twice returns the

        payment already recorded rather than crediting the invoice again, so a

        retried gateway webhook or a double-tapped Pay button cannot settle a bill

        twice.


        Returns 409 for an amount above the outstanding balance -- an overpayment is

        refused rather than clamped, because clamping accepts money and then loses

        it. Also 409 once the invoice has been voided.'
      operationId: record_payment_api_v1_invoices__invoice_id__payments_post
      parameters:
      - description: Invoice id, scoped to the caller's community.
        in: path
        name: invoice_id
        required: true
        schema:
          title: Invoice Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Record a payment
      tags:
      - money
      x-user-stories:
      - coverage: partial
        id: US-2.12
        role: Payment and confirmation are one transaction, so money cannot be taken without the record
          moving with it
        title: Reliable booking payment confirmation
  /api/v1/notices:
    post:
      description: 'Publish a notice to the caller''s community.


        Published immediately: ``published_at`` is set to now. The screen has no draft

        state and no schedule control, so a nullable ``published_at`` left unset would

        create notices that no reader could ever see.


        The insert fires the shared SSE trigger on ``notices``, so every connected

        client re-snapshots and the notice appears without this endpoint needing a

        matching read.


        **``category`` and ``urgency`` are stored but not yet rendered.** The shared

        snapshot projects notices as ``{id, title, description, date, createdAt}``

        (``dashboard_service.py:202``) and drops both fields. Adding them there is a

        one-line change owned by the dashboard workstream; until it lands the two

        values round-trip through this endpoint''s response but not through the

        snapshot.'
      operationId: create_notice_api_v1_notices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoticeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeCreated'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Post a notice
      tags:
      - notices
      x-user-stories:
      - coverage: partial
        id: US-2.4
        role: Publishes immediately and fires the notices SSE trigger; nothing carries it to a resident
          who has not opened the app
        title: Reliable notifications for society notices
  /api/v1/onboarding/community:
