        name: complaint_id
        required: true
        schema:
          title: Complaint Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComplaintRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Update a complaint
      tags:
      - complaints
      x-user-stories:
      - coverage: served
        id: US-2.6
        role: Writes the status and its timeline entries in one transaction, so a status cannot change
          without a trace
        title: Complaint status tracking with history
      - coverage: partial
        id: US-2.7
        role: Every transition the story names -- acknowledged, updated, reassigned, resolved -- writes
          a complaint_events row
        title: Complaint lifecycle notifications
      - coverage: served
