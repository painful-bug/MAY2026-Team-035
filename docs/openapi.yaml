    UpiInstrument:
      description: 'A UPI handle.


        ``vpa`` is optional because the shipped screen does not collect one:

        `Payments.jsx` renders UPI as the only enabled method and its Confirm button

        sends no instrument at all. Omitted, the payment succeeds and the receipt

        line reads `UPI` — the honest record of what was known.


        A VPA whose local part starts `failure` or `fail` always declines. That is

        the UPI half of the expiry-date demonstration; without it the failure path is

        unreachable from the only payment screen that exists.'
      properties:
        vpa:
          default: ''
          maxLength: 120
          title: Vpa
          type: string
      title: UpiInstrument
      type: object
    VapidPublicKey:
      description: 'The public half of the keypair, for ``PushManager.subscribe``.


        Public by construction -- that is what the pair is for. The frontend must

        compare this against the ``applicationServerKey`` its stored subscription was

        created with and re-subscribe when they differ, because a key rotation

        otherwise stops push permanently and silently (§10.5).'
      properties:
        publicKey:
          title: Publickey
          type: string
      required:
      - publicKey
      title: VapidPublicKey
      type: object
    VisitorDigest:
      description: 'Who is expected, who is already inside, and who is waiting on an answer.


        Both counts are **guests, not passes**, because that is what the shipped

        screen counts: `DashboardHome.jsx` reduces over `guestCount`. One pass for a

        party of twelve is twelve people at the gate, and a card reading "1" in front

        of a resident expecting a dozen is a card that has misunderstood the question.


        ``pendingApproval`` carries whole passes because the home screen approves and

        rejects from the card, without navigating.'
      properties:
        checkedInGuests:
          default: 0
          title: Checkedinguests
          type: integer
        expectedGuests:
          default: 0
          title: Expectedguests
          type: integer
        pendingApproval:
          default: []
          items:
            $ref: '#/components/schemas/VisitorPass'
          title: Pendingapproval
          type: array
        pendingCount:
          default: 0
          title: Pendingcount
          type: integer
      title: VisitorDigest
      type: object
    VisitorPass:
      description: 'One pass, as every read returns it.


        Carries **neither** the security code nor the pass token — not even hashed.

        ``visitor_pass_overview`` does not select those columns, so this model could

        not carry them by accident.


        ``isCurrent`` is what splits the two tabs: a pass still ahead of the resident

        against one they are finished with. Computed in the view, so the split cannot

        drift from the transitions the RPC allows.'
      properties:
        cancelledAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Cancelledat
        checkedInAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Checkedinat
        checkedOutAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Checkedoutat
        createdAt:
          format: date-time
          title: Createdat
          type: string
        decidedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Decidedat
        guestCount:
          title: Guestcount
          type: integer
        id:
          title: Id
          type: string
        isCurrent:
          title: Iscurrent
          type: boolean
        isLapsed:
          title: Islapsed
          type: boolean
        purpose:
          title: Purpose
          type: string
        purposeDetails:
          default: ''
          title: Purposedetails
          type: string
        status:
          title: Status
          type: string
        validFrom:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Validfrom
        validUntil:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Validuntil
        visitorName:
          title: Visitorname
          type: string
      required:
      - id
      - visitorName
      - purpose
      - guestCount
      - status
      - createdAt
      - isCurrent
      - isLapsed
      title: VisitorPass
      type: object
    VisitorPassCreated:
      description: 'The response to creating a pass, and the only place the code appears.


        Both secrets are returned **once**. There is no endpoint that will show them

        again, and no support procedure that can recover them — a resident who loses

        the code issues a new pass. That is the correct trade for a gate credential

        and it is how the invite flow already behaves.'
      properties:
        cancelledAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Cancelledat
        checkedInAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Checkedinat
        checkedOutAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
