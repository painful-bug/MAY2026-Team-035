          - type: 'null'
          title: Allowguestbooking
        allowPrivateBooking:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allowprivatebooking
        allowRecurringBooking:
          anyOf:
          - type: boolean
          - type: 'null'
