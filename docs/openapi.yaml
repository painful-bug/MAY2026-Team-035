          title: Status
      - in: query
        name: categoryId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Categoryid
      - in: query
        name: departmentId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Departmentid
      - in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Search
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
