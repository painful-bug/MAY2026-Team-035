          - type: 'null'
          title: Invoicenumber
        invoiceTitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoicetitle
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        paidAt:
          format: date-time
          title: Paidat
          type: string
        payerName:
          anyOf:
          - type: string
          - type: 'null'
          title: Payername
        payerProfileId:
          anyOf:
          - type: string
          - type: 'null'
          title: Payerprofileid
        reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference
        status:
          title: Status
          type: string
        unitId:
          anyOf:
          - type: string
          - type: 'null'
          title: Unitid
      required:
      - id
      - invoiceId
      - amount
      - currency
      - status
      - paidAt
      title: PaymentSummary
      type: object
