          - type: 'null'
          title: Categories
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Description
        email:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Email
        head:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Head
        kind:
          anyOf:
