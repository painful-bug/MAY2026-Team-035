      - label
      - createdAt
      title: TimelineEvent
      type: object
    UpdateBillingSettingsRequest:
      description: 'Patch the billing configuration. Omitted fields are left unchanged.


        ``defaultMaintenanceAmount`` distinguishes omitted from null: sending null

        clears the rate, which stops billing runs until one is set again.'
      properties:
        autoBillingDay:
          anyOf:
          - maximum: 28.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Autobillingday
        autoBillingEnabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Autobillingenabled
        currency:
          anyOf:
          - maxLength: 3
            minLength: 3
            type: string
          - type: 'null'
          title: Currency
        defaultMaintenanceAmount:
          anyOf:
          - maximum: 10000000.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Defaultmaintenanceamount
        defaultTaxPercent:
          anyOf:
          - exclusiveMaximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Defaulttaxpercent
        invoiceNumberPrefix:
          anyOf:
          - maxLength: 12
            minLength: 1
            pattern: ^[A-Za-z0-9-]+$
            type: string
          - type: 'null'
          title: Invoicenumberprefix
        lateFeeAmount:
          anyOf:
          - maximum: 1000000.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Latefeeamount
        lateFeeEnabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Latefeeenabled
        lateFeeGraceDays:
          anyOf:
          - maximum: 90.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Latefeegracedays
        lateFeePeriod:
          anyOf:
          - maxLength: 16
            type: string
          - type: 'null'
          title: Latefeeperiod
        maintenanceDueDay:
          anyOf:
          - maximum: 28.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Maintenancedueday
      title: UpdateBillingSettingsRequest
      type: object
    UpdateComplaintRequest:
      description: Admin edit. Every field optional; omitted fields are left unchanged.
      properties:
        assignedToMembershipId:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignedtomembershipid
        assignee:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Assignee
        expectedResolutionAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expectedresolutionat
        progress:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Progress
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: Pending | In Progress | Resolved
          title: Status
        updateNote:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Updatenote
      title: UpdateComplaintRequest
      type: object
    UpdateDepartmentRequest:
      description: 'Partial update. An omitted field is left alone; an explicit ``null``

        clears it.


        The distinction is real and is preserved all the way to Postgres: the service

        sends only the keys that were set, and the RPC tests ``patch ? ''key''``.

        Sending ``staff`` replaces the whole roster; omitting it leaves it untouched.'
      properties:
        categories:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Categories
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Description
        email:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Email
        head:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Head
        kind:
          anyOf:
          - type: string
          - type: 'null'
          description: service | security
          title: Kind
        name:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        operatingHours:
          anyOf:
          - $ref: '#/components/schemas/OperatingHours-Input'
          - type: 'null'
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
        slaHours:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 8760.0
            type: integer
          - type: 'null'
          title: Slahours
        staff:
          anyOf:
          - items:
              $ref: '#/components/schemas/StaffMemberInput'
            type: array
          - type: 'null'
          title: Staff
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: Active | Inactive
          title: Status
      title: UpdateDepartmentRequest
      type: object
    UpdateResidentRequest:
      description: 'Editable fields on a resident.


        Every field is optional: this is a PATCH, and omitting a field leaves it

        unchanged. Explicitly sending ``null`` clears it.'
      properties:
        designation:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Designation
        email:
          anyOf:
          - maxLength: 320
            type: string
          - type: 'null'
          title: Email
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Name
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
      title: UpdateResidentRequest
      type: object
    UpdateSettingsRequest:
      description: 'Patch the community preferences. Omitted fields are left unchanged.


        ``unitLabelSingular`` distinguishes omitted from null: sending null clears

        the override and goes back to deriving the label from the community type,

        which is not the same as leaving it alone. Key presence is what separates

        them, matching ``defaultMaintenanceAmount`` on the billing patch.'
      properties:
        inviteTtlHours:
          anyOf:
          - maximum: 720.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Invitettlhours
        noticeSmsBroadcastEnabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Noticesmsbroadcastenabled
        requireVisitorPreapproval:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Requirevisitorpreapproval
        timezone:
          anyOf:
          - maxLength: 64
            minLength: 3
            type: string
          - type: 'null'
          title: Timezone
        unitLabelSingular:
          anyOf:
          - maxLength: 24
            type: string
          - type: 'null'
          title: Unitlabelsingular
        visitorCodeTtlMinutes:
          anyOf:
          - maximum: 1440.0
            minimum: 5.0
            type: integer
          - type: 'null'
          title: Visitorcodettlminutes
      title: UpdateSettingsRequest
      type: object
    UpdateStaffMemberRequest:
      description: Patch one roster entry.
      properties:
        name:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
        role:
          anyOf:
          - maxLength: 60
            type: string
          - type: 'null'
          title: Role
        shift:
          anyOf:
          - type: string
          - type: 'null'
          description: Day | Evening | Night
          title: Shift
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: active | inactive
          title: Status
      title: UpdateStaffMemberRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VoidInvoiceRequest:
      description: Cancel an invoice. Refused once any payment has succeeded against it.
      properties:
        reason:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Reason
      title: VoidInvoiceRequest
      type: object
    app__domain__amenity_schemas__OperatingHours:
      description: '``HH:MM`` strings, because the settings form feeds them to

        ``<input type="time">`` -- which renders an empty field for anything it

        cannot parse, including PostgREST''s ``06:00:00``.'
      properties:
        cleaningBufferMinutes:
          title: Cleaningbufferminutes
          type: integer
        closingTime:
          title: Closingtime
          type: string
        openingTime:
          title: Openingtime
          type: string
        slotDurationMinutes:
          title: Slotdurationminutes
          type: integer
      required:
      - openingTime
      - closingTime
      - slotDurationMinutes
      - cleaningBufferMinutes
      title: OperatingHours
      type: object
    app__domain__department_schemas__OperatingHours:
      description: 'One daily window.


        R8: the product collects ONE window, not a weekly schedule, so this is two

        columns on ``departments`` and not a ``department_hours`` table. Both ends

        are nullable because a department may simply not have declared them.'
      properties:
        end:
          anyOf:
          - pattern: ^([01]\d|2[0-3]):[0-5]\d$
            type: string
          - type: 'null'
          examples:
          - '20:00'
          title: End
        start:
          anyOf:
          - pattern: ^([01]\d|2[0-3]):[0-5]\d$
            type: string
          - type: 'null'
          examples:
          - 08:00
          title: Start
      title: OperatingHours
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  summary: Backend for the HomeBandhu residential community platform.
  title: HomeBandhu API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/admin/invitations:
    post:
      description: 'Admin: mint a resident invite; returns the one-time link + code.'
      operationId: create_invitation_api_v1_admin_invitations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Invitation
      tags:
      - invitations
  /api/v1/admins:
    get:
      description: 'Every admin of the caller''s community.


        Returned in the standard page envelope for consistency, but not paginated --

        an association has a committee, not a directory.'
      operationId: list_admins_api_v1_admins_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AdminSummary_'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List admins
      tags:
      - people
  /api/v1/amenities:
    get:
      description: 'The catalogue grid, alphabetically.


        ``pendingRequests`` and ``outstandingDues`` are derived from the approvals

        queue and the ledger rather than stored, so the two badges on a card cannot

        disagree with the tabs they link to. The seeded data stores both as constants

        and they are already wrong there.


        Inactive amenities are included: the resident screen renders them greyed out

        rather than hiding them, so filtering them away here would change what

        residents see.'
      operationId: list_amenities_api_v1_amenities_get
      parameters:
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Q
      - description: Sports | Fitness | Recreation | Events | Utility
        in: query
        name: category
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sports | Fitness | Recreation | Events | Utility
          title: Category
      - description: Active | Inactive | All
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Active | Inactive | All
          title: Status
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 24
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AmenitySummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List amenities
      tags:
      - amenities
    post:
      description: 'Create an amenity, with a full settings row from the defaults.


        Returns 409 when the community already has an amenity of that name -- one

        unique index, so two admins creating "Clubhouse Gym" at the same moment

        cannot both succeed.'
      operationId: create_amenity_api_v1_amenities_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAmenityRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create an amenity
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}:
    delete:
      description: 'Delete an amenity nobody has booked.


        Returns 409 once anything has been booked on it, naming the count and

        pointing at deactivation instead: the cascade would take the bookings, their

        charges and their financial events with it, including deposits residents are

        still owed.'
      operationId: delete_amenity_api_v1_amenities__amenity_id__delete
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete an amenity
      tags:
      - amenities
    get:
      description: One amenity with all five settings groups the settings tab edits.
      operationId: get_amenity_api_v1_amenities__amenity_id__get
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get an amenity
      tags:
      - amenities
    patch:
      description: 'Update the catalogue fields, the settings, or both, in one transaction.


        The settings tab saves thirty fields on one click; splitting that across two

        calls would let the second fail after the first had already been written.

        A field left out is left alone.'
      operationId: update_amenity_api_v1_amenities__amenity_id__patch
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAmenityRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update an amenity
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}/approvals:
    get:
      description: 'The approvals tab -- **one row per request, not per day**.


        The frontend produces one row per day and approves them one at a time, so a

        three-day request appears three times and can be approved on Monday and

        rejected on Tuesday. Here one decision covers the request, and ``dayCount``

        and ``dates`` say how much it covers.


        ``outstandingDues`` is the **flat''s** balance across its unpaid invoices. The

        frontend computes it per person; our invoices attach to the unit and carry no

        person, so it is the same label over a different number

        (DECISIONS_NEEDED E18).'
      operationId: list_approvals_api_v1_amenities__amenity_id__approvals_get
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      - description: pending | approved | rejected | cancelled | all
        in: query
        name: status
        required: false
        schema:
          default: pending
          description: pending | approved | rejected | cancelled | all
          title: Status
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApprovalRequest_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List booking requests awaiting a decision
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}/blocks:
    post:
      description: 'Reserve a slot for maintenance or an association event.


        Always exclusive, whatever the amenity''s booking mode says: a hall closed for

        repairs is closed to everybody. Carries no flat and no charges.'
      operationId: block_slot_api_v1_amenities__amenity_id__blocks_post
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockSlotRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Block a slot administratively
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}/bookings:
    get:
      description: 'The day timeline.


        ``state`` is the timeline''s vocabulary (''booked'' | ''blocked''); ``status`` is

        the lifecycle''s. The cleaning buffer is deliberately not sent as a block: the

        frontend synthesises buffers at render time from the booking''s end and the

        amenity''s buffer, and sending them too would give one block two sources.


        A booking whose end time has passed reads ``completed`` even though it is

        stored as ``approved`` -- that is a fact about the clock, not about the row.'
      operationId: list_amenity_bookings_api_v1_amenities__amenity_id__bookings_get
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      - in: query
        name: date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
      - in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: From
      - in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: To
      - description: Drop pending, rejected and cancelled days, matching what the timeline paints. Set
          false for the full history.
        in: query
        name: timelineOnly
        required: false
        schema:
          default: true
          description: Drop pending, rejected and cancelled days, matching what the timeline paints. Set
            false for the full history.
          title: Timelineonly
          type: boolean
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_BookingSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List an amenity's bookings
      tags:
      - amenities
    post:
      description: 'The admin''s Create Booking modal. Confirmed on creation, never pending.


        The opening-hours, closed-day and advance-window rules are **not** applied:

        an admin booking the hall outside opening hours is doing their job. The

        conflict rules still apply -- two things cannot occupy one room whoever

        booked them -- so this returns 409 when the slot is taken or full.


        ``chargeOverride`` replaces the booking fee and nothing else. A waived fee

        does not waive the deposit, which is coming back.'
      operationId: create_admin_booking_api_v1_amenities__amenity_id__bookings_post
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingSummary'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create a booking on a resident's behalf
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}/bookings/request:
    post:
      description: 'A resident asking for one or more days of the same slot.


        The flat is read from the caller''s own residency, never from the body, so a

        resident cannot book against somebody else''s unit by editing the request.

        Whether it needs approval is read from the amenity''s settings for the same

        reason: a client that could choose would be a client that could opt out.


        Every day is validated before any is written, so a three-day request either

        lands whole or not at all. Returns 409 for a closed day, a slot outside the

        booking window, a duration outside the amenity''s limits, a full slot, or a

        conflict -- each with the message the booking form already shows.


        Returns every day created, because telling the caller about one day of three

        is how a resident is surprised by the other two.'
      operationId: request_booking_api_v1_amenities__amenity_id__bookings_request_post
      parameters:
      - in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentBookingRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_BookingSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Request a booking (resident)
      tags:
      - amenities
  /api/v1/amenities/{amenity_id}/ledger:
    get:
      description: 'The ledger tab.


        Every figure is derived from the charges and the append-only event stream --

        nothing stores a balance, so no balance can drift out of agreement with the

        rows that produce it. ``paymentStatus`` is a CASE over those figures, and the

        order of its arms is its meaning: a cancelled booking still holding a

        refundable deposit is ``refund_pending``, because somebody is owed money.


        ``availableActions`` is computed from the same rules the write endpoints

        enforce, so a button the client renders is a button the API will honour.'
      operationId: list_ledger_api_v1_amenities__amenity_id__ledger_get
      parameters:
      - in: path
        name: amenity_id
        required: true
