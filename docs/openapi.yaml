        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/invitations/redeem:
    post:
      description: 'Redeem the staged invitation for the signed-in Google identity.


        Requires **both** factors: the signed cookie from `prepare` and a verified access token. The invitation
        token is a mandatory second factor and there is no path that redeems on identity alone. An invitation
        already used or revoked is **409**.'
      operationId: redeem_invitation_api_v1_invitations_redeem_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
