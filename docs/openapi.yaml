          title: Outstandingamount
          type: string
        paidAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Paidat
        paymentMethod:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentmethod
        status:
          title: Status
          type: string
        storedStatus:
          title: Storedstatus
          type: string
        title:
          title: Title
          type: string
        totalAmount:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Totalamount
