      type: object
    RefreshRequest:
      description: Body for refreshing a session (the 'remember me' path).
      properties:
        refresh_token:
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: RefreshRequest
      type: object
    RefundDepositRequest:
      description: 'No amount. It is what is left of the deposit after damage, computed

        server-side -- a refund whose amount is a request parameter is a refund

        somebody can ask to be larger.'
