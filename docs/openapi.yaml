    PreferenceSettings:
      description: 'Community-wide preferences.


        ``unitLabelIsDerived`` says whether ``unitLabelSingular`` was chosen or

        inferred from the community type. A screen that cannot tell the difference

        shows an admin a value they never picked as though they had.


        ``requireVisitorPreapproval`` and ``noticeSmsBroadcastEnabled`` are stored and

        read by nothing -- there is no visitor backend and no SMS provider in this

        repository. They exist so the screen stops losing them, and API.md says so

        rather than leaving it to be discovered.'
      properties:
        inviteTtlHours:
          title: Invitettlhours
          type: integer
        noticeSmsBroadcastEnabled:
          title: Noticesmsbroadcastenabled
          type: boolean
        requireVisitorPreapproval:
          title: Requirevisitorpreapproval
          type: boolean
        timezone:
          title: Timezone
          type: string
        unitLabelIsDerived:
          title: Unitlabelisderived
          type: boolean
        unitLabelSingular:
          title: Unitlabelsingular
          type: string
        visitorCodeTtlMinutes:
          title: Visitorcodettlminutes
          type: integer
      required:
      - timezone
      - unitLabelSingular
      - unitLabelIsDerived
      - inviteTtlHours
      - visitorCodeTtlMinutes
      - requireVisitorPreapproval
      - noticeSmsBroadcastEnabled
      title: PreferenceSettings
      type: object
    Profile:
      description: A user's community profile (the ``profiles`` table row).
      properties:
        apartment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Apartment Id
        association_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Association Id
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        id:
          title: Id
          type: string
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        role:
          $ref: '#/components/schemas/Role'
        status:
          default: Active
          title: Status
          type: string
      required:
      - id
      - role
      title: Profile
      type: object
    RecordAmenityPaymentRequest:
      description: '``paymentReference`` makes this idempotent: a replayed gateway callback

        returns the event already recorded rather than double-crediting.'
      properties:
        amount:
          exclusiveMinimum: 0.0
          title: Amount
          type: number
        chargeType:
          default: booking
          title: Chargetype
          type: string
        method:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          title: Method
        notes:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Notes
        paymentReference:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Paymentreference
      required:
      - amount
      title: RecordAmenityPaymentRequest
      type: object
    RecordPaymentRequest:
      description: 'Record money received against an invoice.


        ``reference`` makes the call **idempotent**: sending the same reference twice

        returns the payment already recorded rather than crediting the invoice twice.

        A gateway that retries its webhook, or a resident who double-taps Pay, must

        not settle a bill two times.'
      properties:
        amount:
          exclusiveMinimum: 0.0
          maximum: 10000000.0
          title: Amount
          type: number
        method:
          default: Cash
          title: Method
          type: string
        notes:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Notes
        paidAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Paidat
        payerProfileId:
          anyOf:
          - type: string
          - type: 'null'
          title: Payerprofileid
        reference:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Reference
      required:
      - amount
      title: RecordPaymentRequest
      type: object
    RedeemRequest:
      description: 'Resident request to redeem an invite via link token or typed code.


        Exactly one of ``token`` (from the magic link) or ``code`` (typed manually)

        must be provided, along with the phone number being registered.'
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
        phone:
