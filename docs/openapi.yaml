        ``membershipId`` is nullable and usually null: C1 established that the

        frontend records only a name and a phone number, so most staff have no

        account. ``name`` is therefore authoritative and the link is the enrichment,

        not the other way round.'
      properties:
        activeAssignmentCount:
          default: 0
          title: Activeassignmentcount
          type: integer
        id:
          title: Id
          type: string
        membershipId:
          anyOf:
          - type: string
          - type: 'null'
          title: Membershipid
        name:
          title: Name
          type: string
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        rank:
          default: member
          title: Rank
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        shift:
          anyOf:
          - type: string
          - type: 'null'
          title: Shift
        status:
          default: active
          title: Status
          type: string
      required:
      - id
      - name
      title: StaffMember
      type: object
    StaffMemberInput:
      description: 'A staff member as submitted by the department form.


        ``id`` is optional: the frontend generates a local id for new rows and keeps

        the server id for existing ones, so presence is what distinguishes an update

        from an insert.'
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
        role:
          anyOf:
          - maxLength: 60
            type: string
          - type: 'null'
          title: Role
        shift:
          anyOf:
          - type: string
          - type: 'null'
          description: Day | Evening | Night
          title: Shift
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: active | inactive
          title: Status
      required:
      - name
      title: StaffMemberInput
      type: object
    UpdateBillingSettingsRequest:
      description: 'Patch the billing configuration. Omitted fields are left unchanged.


        ``defaultMaintenanceAmount`` distinguishes omitted from null: sending null

        clears the rate, which stops billing runs until one is set again.'
      properties:
        autoBillingDay:
          anyOf:
          - maximum: 28.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Autobillingday
        autoBillingEnabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Autobillingenabled
        currency:
          anyOf:
          - maxLength: 3
            minLength: 3
            type: string
          - type: 'null'
          title: Currency
        defaultMaintenanceAmount:
          anyOf:
          - maximum: 10000000.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Defaultmaintenanceamount
        defaultTaxPercent:
          anyOf:
          - exclusiveMaximum: 100.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Defaulttaxpercent
        invoiceNumberPrefix:
          anyOf:
          - maxLength: 12
            minLength: 1
            pattern: ^[A-Za-z0-9-]+$
            type: string
          - type: 'null'
          title: Invoicenumberprefix
        lateFeeAmount:
          anyOf:
          - maximum: 1000000.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Latefeeamount
        lateFeeEnabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Latefeeenabled
        lateFeeGraceDays:
          anyOf:
          - maximum: 90.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Latefeegracedays
        lateFeePeriod:
          anyOf:
          - maxLength: 16
            type: string
          - type: 'null'
          title: Latefeeperiod
        maintenanceDueDay:
          anyOf:
          - maximum: 28.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Maintenancedueday
      title: UpdateBillingSettingsRequest
      type: object
    UpdateComplaintRequest:
      description: Admin edit. Every field optional; omitted fields are left unchanged.
      properties:
        assignedToMembershipId:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignedtomembershipid
        assignee:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Assignee
        expectedResolutionAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expectedresolutionat
        progress:
          anyOf:
          - maximum: 100.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Progress
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: Pending | In Progress | Resolved
          title: Status
        updateNote:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Updatenote
      title: UpdateComplaintRequest
      type: object
    UpdateDepartmentRequest:
      description: 'Partial update. An omitted field is left alone; an explicit ``null``

        clears it.


        The distinction is real and is preserved all the way to Postgres: the service

        sends only the keys that were set, and the RPC tests ``patch ? ''key''``.

        Sending ``staff`` replaces the whole roster; omitting it leaves it untouched.'
      properties:
        categories:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Categories
        description:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Description
        email:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Email
        head:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Head
        kind:
          anyOf:
          - type: string
          - type: 'null'
          description: service | security
          title: Kind
        name:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        operatingHours:
          anyOf:
          - $ref: '#/components/schemas/OperatingHours'
          - type: 'null'
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
        slaHours:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 8760.0
            type: integer
          - type: 'null'
          title: Slahours
        staff:
          anyOf:
          - items:
              $ref: '#/components/schemas/StaffMemberInput'
            type: array
          - type: 'null'
          title: Staff
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: Active | Inactive
          title: Status
      title: UpdateDepartmentRequest
      type: object
    UpdateSettingsRequest:
      description: 'Patch the community preferences. Omitted fields are left unchanged.


        ``unitLabelSingular`` distinguishes omitted from null: sending null clears

        the override and goes back to deriving the label from the community type,

        which is not the same as leaving it alone. Key presence is what separates

        them, matching ``defaultMaintenanceAmount`` on the billing patch.'
      properties:
        inviteTtlHours:
          anyOf:
          - maximum: 720.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Invitettlhours
        noticeSmsBroadcastEnabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Noticesmsbroadcastenabled
        requireVisitorPreapproval:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Requirevisitorpreapproval
        timezone:
          anyOf:
          - maxLength: 64
            minLength: 3
            type: string
          - type: 'null'
          title: Timezone
        unitLabelSingular:
          anyOf:
          - maxLength: 24
            type: string
          - type: 'null'
          title: Unitlabelsingular
        visitorCodeTtlMinutes:
          anyOf:
          - maximum: 1440.0
            minimum: 5.0
            type: integer
          - type: 'null'
          title: Visitorcodettlminutes
      title: UpdateSettingsRequest
      type: object
    UpdateStaffMemberRequest:
      description: Patch one roster entry.
      properties:
        name:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Phone
        role:
          anyOf:
          - maxLength: 60
            type: string
          - type: 'null'
          title: Role
        shift:
          anyOf:
          - type: string
          - type: 'null'
          description: Day | Evening | Night
          title: Shift
        status:
          anyOf:
          - type: string
          - type: 'null'
          description: active | inactive
          title: Status
      title: UpdateStaffMemberRequest
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  contact:
    name: HomeBandhu backend workstream, Team 035
    url: https://github.com/painful-bug/MAY2026-Team-035
  description: "Admin-dashboard backend for HomeBandhu, a FastAPI service over Supabase.\n\n## Reading\
    \ this document\n\nEvery operation carries four things beyond its request and response schemas:\n\n\
    * a **summary** and a **description** saying what it does and what is\n  surprising about it;\n* the\
    \ **error responses it can actually return**, derived by walking each\n  handler into its services\
    \ and repositories rather than assumed;\n* **`x-user-stories`**, tracing the operation back to the\
    \ team's requirements;\n* **`security`**, or its deliberate absence on the pre-authentication routes.\n\
    \n## Errors\n\nEvery failure returns one envelope, `ErrorResponse`:\n\n```json\n{\"error\": {\"code\"\
    : \"not_found\", \"message\": \"Department not found.\", \"details\": []}}\n```\n\nBranch on `error.code`,\
    \ never on `error.message`, which is prose and may be\nreworded. `details[]` appears only on `request_validation_error`\
    \ and lists the\noffending fields. This shape is emitted by all four handlers registered in\n`app/core/exceptions.py`,\
    \ including the catch-all, so a client needs exactly one\nerror path. Note that this is **not** FastAPI's\
    \ stock `{\"detail\": [...]}`: the\ndefault handlers are replaced.\n\n`404` is returned both for a\
    \ resource that does not exist and for one the caller\nmay not see. That ambiguity is deliberate --\
    \ a 404 must never confirm that\nanother community's data exists.\n\n## User stories\n\n`x-user-stories`\
    \ links an operation to the stories in\n`docs/product/USER_STORIES.md`, with the role it plays in\
    \ each and whether that\nstory is `served` or `partial`.\n\nAn operation that serves none carries\
    \ `x-no-user-story` instead, which states\n`Not covered by user story` and then classifies what the\
    \ operation is --\n`Feature`, `Functional`, `Configuration`, `Master data` or `Non-functional` --\n\
    with the reason. Absence of a story is therefore a recorded verdict rather than\nan omission, and\
    \ says what the operation *is* instead of only what it is not.\n\n`docs/API.md` section 14 is the\
    \ prose matrix, and is the only one of the two\nthat also names the stories **nothing** serves yet\
    \ -- a spec can only describe\nendpoints that exist.\n\n## Scope\n\nThis describes the admin-dashboard\
    \ build. `docs/product/USER_IDENTIFICATION.md`\nrecords one consequence worth knowing before reading\
    \ the traceability: staff\nhave no login, so every story written for a Facility or Security Manager\
    \ is\neither an administrator acting on their behalf or has no home here.\n"
  license:
    identifier: LicenseRef-coursework
    name: UNLICENSED
  summary: Backend for the HomeBandhu residential community platform.
  title: HomeBandhu API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/access-requests:
    post:
      description: 'Apply to join a community. Answers **201**.


        Four distinct refusals, deliberately separated: an unknown community is **404**; already being
        a member, or already having a request pending, is **409**; a rejected application inside the cool-off
        window is **409**; and a unit that belongs to a different community is **422**, because the request
        is coherent but the pairing is not.'
      operationId: create_access_request_api_v1_access_requests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Create Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/access-requests/mine:
    get:
      description: 'List the caller''s own join requests and their current status.


        Scoped to the caller by identity rather than by a parameter, so there is nothing here to tamper
        with.'
      operationId: my_access_requests_api_v1_access_requests_mine_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestListResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: My Access Requests
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/access-requests/{request_id}/withdraw:
    post:
      description: 'Withdraw a pending request.


        Only a request still pending can be withdrawn; anything already decided is **409**. Withdrawal
        is a status transition, not a deletion, so the community''s audit trail keeps the attempt.'
      operationId: withdraw_access_request_api_v1_access_requests__request_id__withdraw_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Withdraw Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests:
    get:
      description: 'The administrator''s review queue for the caller''s community.


        `status` defaults to `pending`, which is the screen''s default view; `limit` is capped at 100.
        Both are validated by pattern and range, so a bad filter is **422** rather than a silent empty
        page.'
      operationId: admin_access_requests_api_v1_admin_access_requests_get
      parameters:
      - description: 'Queue to show: `pending`, `approved`, `rejected` or `withdrawn`. Anything else is
          422 rather than an empty page.'
        in: query
        name: status
        required: false
        schema:
          default: pending
          pattern: ^(pending|approved|rejected|withdrawn)$
          title: Status
          type: string
      - description: Maximum rows to return (1-100).
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestListResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Admin Access Requests
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests/{request_id}/approve:
    post:
      description: 'Approve a join request, creating the membership.


        Approving a request that is not pending is **409** -- which is what two administrators clicking
        the same row a second apart will get, and the reason the second one is not silently ignored.'
      operationId: approve_access_request_api_v1_admin_access_requests__request_id__approve_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Approve Access Request Api V1 Admin Access Requests  Request Id  Approve
                  Post
                type: object
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Approve Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests/{request_id}/blacklist:
    post:
      description: 'Reject a request and bar the applicant from re-applying.


        The difference from `reject` is only the cool-off: a blacklisted applicant has no expiry to wait
        out.'
      operationId: blacklist_access_request_api_v1_admin_access_requests__request_id__blacklist_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlacklistAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Blacklist Access Request Api V1 Admin Access Requests  Request Id  Blacklist
                  Post
                type: object
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Blacklist Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests/{request_id}/reject:
    post:
      description: 'Reject a join request, with a reason recorded against it.


        The applicant may apply again after the cool-off window; see `POST /access-requests`, which enforces
        it.'
      operationId: reject_access_request_api_v1_admin_access_requests__request_id__reject_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Reject Access Request Api V1 Admin Access Requests  Request Id  Reject
                  Post
                type: object
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Reject Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/invitations:
    post:
      description: 'Issue a resident invitation, returning its code and link.


        The invite is bound to the email address given here. Redemption later checks that the Google identity
        signing in matches it, which is why the address is required rather than optional.'
      operationId: create_invitation_api_v1_admin_invitations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Create Invitation
      tags:
      - invitations
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admins:
    post:
      description: 'Give an existing community member the ``admin`` role.


        **This promotes, it does not invite.** The person must already be an active

        member of the caller''s community, matched by email. That is the flow

        ``roles.md`` describes -- *"Resident -> Committee members -> Admin"* -- and it

        is the only one available: the shared invitation contract hardcodes

        ``intended_role = ''resident''`` and exposes no role field, so an admin-bound

        invite cannot be minted without duplicating the token machinery this

        workstream does not own.


        Returns **404** when the email belongs to nobody in the community. The caller

        should invite them first (``POST /admin/invitations``), let them redeem, then

        promote. Returns **409** if they are already an admin.


        Only ``email`` is used. ``name``, ``phone``, ``tower`` and ``flat`` are

        accepted because the Admins screen sends them, but the member already has all

        four on their profile and residency, and letting a promotion silently rewrite

        someone''s flat would be a worse bug than ignoring the fields.'
      operationId: promote_admin_api_v1_admins_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteAdminRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSummary'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Promote a member to administrator
      tags:
