          stories -- accepting, starting, completing and reporting a failed visit all reach the resident
          -- and these do not, which is the distinction worth keeping. A worker reading their own queue
          is nobody''s user story: the interviews were with residents and committee members, and the plumber
          was never in the room. See `service_provider` for the same structural gap stated at registration.'
        status: Not covered by user story
      x-user-stories: []
  /api/v1/worker/snapshot:
    get:
      description: 'Everything the worker''s dashboard renders, in one call.


        **A null `provider` is not an error, it is the empty state.** A caller who

        has never registered gets a snapshot with nothing in it rather than a `404`,

        and a registered caller employed nowhere gets an empty `communities` — so the

        dashboard decides between "show the registration form", "show the community

        search" and "show the week" from one response instead of interpreting two

        failures.


        **`communities` is filled independently of `provider`.** `provider: null`

        with a non-empty `communities` is department leadership: a manager or

        supervisor an administrator created by email holds a membership and a roster

        row and no `service_providers` row, because leadership has no registration

        process. A client must therefore decide the registration form on `provider`

        **and** `communities[].rank` — an active `manager` or `supervisor`

        engagement is never sent to it, while `member` and no engagement at all

        still are, because coordinates and trades are how those people are found.


        `todayJobs` and `nextJob` answer different questions and both are needed: at

        six in the evening today''s list is history, and what a worker wants then is

        tomorrow morning.


        `unreadNotifications` counts across **every** community the caller works in.

        It is the one place a user can see the multi-community seam this feature

        added to `app/api/deps.py`.


        Sequential reads, so `generatedAt` is when the payload was assembled rather

        than when any part of it was true — the same honesty `GET /resident/snapshot`

        prints about itself.'
      operationId: worker_snapshot_api_v1_worker_snapshot_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSnapshot'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: The worker dashboard aggregate
      tags:
      - worker-jobs
      x-no-user-story:
        api-type: Feature
        rationale: 'The service person''s own screens: their job list, the detail they need in order to
          turn up, and the dashboard aggregate behind all of it. Four operations on this surface DO serve
          stories -- accepting, starting, completing and reporting a failed visit all reach the resident
          -- and these do not, which is the distinction worth keeping. A worker reading their own queue
          is nobody''s user story: the interviews were with residents and committee members, and the plumber
          was never in the room. See `service_provider` for the same structural gap stated at registration.'
        status: Not covered by user story
      x-user-stories: []
  /api/v1/worker/unavailability:
    get:
      description: 'The caller''s own blocks, earliest first.


        The range filter matches on **overlap** rather than on start: a fortnight of

        leave that a one-week calendar is sitting in the middle of belongs in that

        week''s answer, and filtering by start alone would drop exactly the block that

        matters most.


        `scope` says whether a block is the caller''s own — everywhere they work — or

        was recorded against one roster row. Only the first can be written here; the

        second exists for a name typed onto a roster by an admin, who has no account

        of their own.'
      operationId: list_unavailability_api_v1_worker_unavailability_get
      parameters:
      - description: Start of an inclusive date range (`YYYY-MM-DD`).
        in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: From
      - description: End of an inclusive date range (`YYYY-MM-DD`).
        in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: To
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UnavailabilityBlock'
                title: Response List Unavailability Api V1 Worker Unavailability Get
