tags:
- description: Sign-in, token refresh and the caller's own profile.
  name: auth
- description: Privacy-minimal, best-effort service-signup funnel events.
  name: telemetry
- description: Founding a community -- once per community, by its first admin.
  name: onboarding
- description: Finding a community to join, and reading its unit list.
  name: communities
- description: A resident asking to join a community, and the admin queue that answers.
  name: access requests
- description: Admin-issued invites and their redemption.
  name: invitations
- description: Admin dashboard tiles, community profile and residents.
  name: dashboard
- description: Admins and the registration review queue.
  name: people
- description: Complaints, their timeline, comments and attachments.
  name: complaints
- description: Departments, staff rosters and complaint categories.
  name: departments
- description: The amenity catalogue, its bookings, approvals and ledger.
  name: amenities
- description: 'Community-side billing: invoices raised, payments recorded.'
  name: money
- description: Community and billing configuration.
  name: settings
- description: Society notices.
  name: notices
- description: A resident's own home screen, household and directory.
  name: resident-home
- description: 'Visitor passes: pre-approval, approval at the gate, cancellation.'
  name: visitors
- description: A resident's own invoices and bookings, and paying them.
  name: resident-money
- description: The resident's in-app notification feed and its read state.
  name: notifications
- description: 'Web Push plumbing: the application server key and its subscriptions.'
  name: push
- description: The server-sent event stream.
  name: realtime
- description: Applications, invitations, candidate search, removal and blacklisting, from the department's
    side. HTTP establishes identity; the database decides whether the caller may hire for this department.
  name: department-hiring
- description: A service person's own registration and the global catalogue of trades. The only surface
    here whose callers hold no community membership.
  name: service-providers
- description: Finding work and tracking applications, from the service person's side. Scoped to the caller's
    own provider row, never to a community id they supply.
  name: worker-communities
- description: 'A service person''s own jobs and the five things they can do to one. Authenticated only
    and cross-community by design: a role guard here would read the wrong one of a worker''s four memberships.'
  name: worker-jobs
- description: A service person's calendar, leave and working week -- all of it global across every community
    that employs them, which is what the dispatch sweep reads before offering anybody a job.
  name: worker-schedule
- description: The chat between a department and a service person. One thread per pair, and the only surface
    here with no role guard at all -- participation is a property of the thread, so the database decides
    it.
  name: conversations
- description: 'Direct messages between people (0046): the chat dock on every portal. One thread per pair
    per community; a resident and a serviceman share only the work-order thread, which locks when the
    job ends. Identity-only guard for the conversations reason -- participation is a property of the thread.'
  name: messages
- description: Which department owns a complaint. Decided when it is raised -- the category first, the
    resident's own guess second, the admin's triage queue third -- and corrected afterwards by an admin
    allotting, a manager moving, or a supervisor asking their manager to.
  name: complaint-routing
- description: Turning a triaged complaint into a scheduled visit by a named person. The role guard is
    coarse because a supervisor is a rank on a roster and not a membership role; the department check
    is in the database.
  name: work-orders
- description: 'The supervisor''s landing dashboard: the department''s untouched, taken up, offered-but-unanswered,
    assigned and being-worked-right-now work in one read, and the verbs on the cards -- take up, resolve,
    raise the priority, note it internally, open a chat with the resident. All of them are triage and
    none is dispatch: who is actually going is a work-order assignment, which is `work-orders`'' route.'
  name: supervisor-triage
- description: The resident's answer to a proposed visit. Two routes, neither of which takes a work-order
    id -- the job is resolved from the complaint, so naming somebody else's is not expressible.
  name: resident-scheduling
- description: 'The gate: posts, shifts, the two registers, incidents, credential verification and the
    CSV exports. The one surface in this feature scoped to a single community, because a gate belongs
    to one society.'
  name: security-operations
- description: Authoring the global trade catalogue, and saying which trades a department needs. Reading
    the catalogue is `service-providers`' `GET /skills`, because that endpoint exists for the registration
    screen and any signed-in person may call it; everything here is admin-or-manager only. The catalogue
    is global and a department's claim on it is not.
  name: skills
- description: 'Address search and reverse geocoding for the location picker, proxied to OpenStreetMap''s
    Nominatim. Server-side rather than from the browser because the upstream''s usage policy asks for
    an identifying User-Agent, one request per second per application, and caching -- and a tab can honour
    none of the three. No API key, one fixed host, and explicit search only: autocomplete against that
    service is forbidden.'
  name: geo
- description: Liveness.
  name: system
