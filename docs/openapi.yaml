    PayBookingRequest:
      description: 'Identical to paying an invoice, and deliberately not a separate shape.


        One simulator, one settlement contract, two callers. `US-2.12` is about the

        transaction that follows — a successful payment must always leave a confirmed

        booking — and that lives in `settle_amenity_booking_payment`, not here.'
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          title: Amount
        card:
          anyOf:
          - $ref: '#/components/schemas/CardInstrument'
          - type: 'null'
        idempotencyKey:
          maxLength: 120
          minLength: 8
          title: Idempotencykey
          type: string
        method:
          default: upi
          enum:
          - upi
          - card
          title: Method
          type: string
        upi:
          anyOf:
          - $ref: '#/components/schemas/UpiInstrument'
          - type: 'null'
      required:
      - amount
      - idempotencyKey
      title: PayBookingRequest
      type: object
    PayInvoiceRequest:
      description: "A resident's attempt to settle one bill.\n\n``amount`` is required and is checked\
        \ against the balance **the database\ncomputes**, not accepted as an instruction. It is in the\
        \ request so a client\nworking from a stale screen can be told so, rather than so it can choose\
        \ what\nto pay: a partial payment is a policy question nobody has answered, and\naccepting one\
        \ silently would leave a resident believing they had paid.\n\n``idempotencyKey`` is required,\
        \ and the rule for minting it is the part that\ncannot be enforced from this side (§11.4):\n\n\
        * **One key per press of Pay.** A double-tap, a dropped connection, a retried\n  request — same\
        \ key, same payment returned, and the caller cannot tell\n  whether it settled now or a moment\
        \ ago. This is what stops a resident\n  paying twice.\n* **A new key for a new attempt.** Once\
        \ the client has *shown* someone a\n  decline, the next press is a different attempt. Reusing\
        \ the key there would\n  replay the old failure forever, and a corrected card would never work.\n\
        \nThe key identifies an attempt, not an invoice. Backwards, it produces either a\ndouble charge\
        \ or an unpayable bill."
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          title: Amount
        card:
          anyOf:
          - $ref: '#/components/schemas/CardInstrument'
          - type: 'null'
        idempotencyKey:
          maxLength: 120
          minLength: 8
          title: Idempotencykey
          type: string
        method:
          default: upi
          enum:
          - upi
          - card
          title: Method
          type: string
        upi:
          anyOf:
          - $ref: '#/components/schemas/UpiInstrument'
          - type: 'null'
      required:
      - amount
      - idempotencyKey
      title: PayInvoiceRequest
      type: object
    PaymentOutcome:
      description: 'The result of an attempt. **`200` whether it succeeded or not.**


        ``failureCode`` is a stable identifier, never a sentence: `card_expired`,

        `insufficient_funds`, `payment_declined`. The wording a resident reads is the

        client''s to choose and to translate.'
      properties:
        amount:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
          type: string
        failureCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Failurecode
        instrumentLabel:
          title: Instrumentlabel
          type: string
        paymentId:
          title: Paymentid
          type: string
        settledStatus:
          title: Settledstatus
          type: string
        status:
          title: Status
          type: string
      required:
      - paymentId
      - status
      - instrumentLabel
      - amount
      - settledStatus
      title: PaymentOutcome
      type: object
    PaymentSummary:
      description: 'One payment against one invoice.


        ``method`` is the display string the payment history renders (``Net

        Banking``), not the stored vocabulary (``netbanking``).'
      properties:
        amount:
          title: Amount
          type: number
