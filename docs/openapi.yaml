        role: isOverdue is computed in the database against the same clock the admin's overdue count uses,
          so the two screens cannot disagree
        title: Complaint accountability
    patch:
      description: 'Change status, assignee, progress or the expected resolution date.


        The edit and its timeline entries are written in **one transaction**, so a

        status can never change without leaving a trace. `updateNote` writes a

        resident-visible timeline entry even when nothing else changes.'
