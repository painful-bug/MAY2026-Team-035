          - type: 'null'
          title: Takenupbyname
        title:
          default: ''
          title: Title
          type: string
        unitCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Unitcode
      required:
      - id
      - priority
      - status
      title: TriageComplaint
      type: object
    TriageSnapshot:
      description: 'One department''s dashboard, in one read.


        Empty arrays and never a 404: a department with nothing in a section has an

        empty section, and a department the caller may not see is a 403 from the RPC

        rather than a snapshot that happens to be blank. An empty dashboard and a

        refused one look identical on a screen, and the difference is the whole

        content of the answer.


        **Five sections since amendment 2**, and the fifth is not a split of an old

        one so much as a correction to it: an offered job nobody has accepted was

        being shown as assigned work. ``openRequests`` sits between ``takenUp`` and

        ``assignedPending``, and *committed* -- an ``accepted`` assignment, or status

        ``scheduled`` -- is now the line between them.'
      properties:
        assignedPending:
          default: []
          items:
            $ref: '#/components/schemas/TriageWorkOrder'
          title: Assignedpending
          type: array
        awaitingResident:
          default: []
          items:
            $ref: '#/components/schemas/TriageWorkOrder'
          title: Awaitingresident
          type: array
        departmentId:
          title: Departmentid
          type: string
        inProgress:
          default: []
          items:
            $ref: '#/components/schemas/TriageWorkOrder'
          title: Inprogress
          type: array
        newComplaints:
          default: []
          items:
            $ref: '#/components/schemas/TriageComplaint'
          title: Newcomplaints
          type: array
        openRequests:
          default: []
          items:
            $ref: '#/components/schemas/TriageWorkOrder'
          title: Openrequests
          type: array
        takenUp:
          default: []
          items:
            $ref: '#/components/schemas/TriageComplaint'
          title: Takenup
          type: array
      required:
      - departmentId
      title: TriageSnapshot
      type: object
    TriageWorkOrder:
      description: 'A job on the supervisor''s dashboard: sections 3, 4 and 5.


        ``status`` is the **work-order** vocabulary and is passed through unmapped --

        ``draft``, ``awaiting_resident``, ``offered``, ``scheduled``,

        ``in_progress``. That is not an inconsistency with ``TriageComplaint.status``

        beside it: the two are different vocabularies for different nouns, and

        ``work_order_schemas.WorkOrder`` has always sent the storage words for this

        one. Renaming them here would give the same field two spellings depending on

        which endpoint answered.


        ``inheritedAt`` is ``work_orders.supervision_inherited_at``: this job arrived

        by somebody''s removal rather than by the reader''s own hand. Supervisor-only

        by construction -- no resident-facing or worker-facing read has ever returned

        a supervisor''s identity, which is why re-stamping needed no notification.


        ``offeredToName`` is the other half of ``assigneeName`` and arrived with

        amendment 2''s ruling A3. ``assigneeName`` is now the person who **accepted**

        and ``offeredToName`` is the person who has been asked and has not answered.

        One field carrying both would make a section-3 card read "Ravi is coming"

        about a job Ravi has not agreed to, which is the exact confusion the ruling

        exists to remove.'
      properties:
        assigneeName:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigneename
        complaintCategory:
          default: ''
          title: Complaintcategory
          type: string
        complaintId:
          anyOf:
          - type: string
          - type: 'null'
          title: Complaintid
        complaintTitle:
          default: ''
          title: Complainttitle
          type: string
        id:
          title: Id
          type: string
        inheritedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Inheritedat
        locationText:
          anyOf:
          - type: string
          - type: 'null'
          title: Locationtext
        offeredToName:
          anyOf:
          - type: string
          - type: 'null'
          title: Offeredtoname
        priority:
          title: Priority
          type: string
        scheduledEndAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduledendat
        scheduledStartAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduledstartat
        skillName:
          anyOf:
          - type: string
          - type: 'null'
          title: Skillname
        startedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Startedat
        status:
          title: Status
          type: string
      required:
      - id
      - priority
      - status
      title: TriageWorkOrder
      type: object
    UnassignedComplaint:
