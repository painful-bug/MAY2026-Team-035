  /api/v1/visitor-passes:
    get:
      description: 'The caller''s own passes, newest first.


        `current` is a pass still ahead of them — open, and not past its window.

        `history` is everything else. The split is computed in

        `visitor_pass_overview` rather than from a status list here, so it cannot

        drift from the transitions the RPC allows.


        **No security code and no pass token on any row.** They are returned once, by

        `POST /visitor-passes`, and the view this reads does not carry the columns

        they were hashed into.'
      operationId: list_my_visitor_passes_api_v1_visitor_passes_get
      parameters:
      - description: '`current` | `history`. Omitted returns both.'
        in: query
        name: view
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`current` | `history`. Omitted returns both.'
          title: View
      - description: 1-based page number.
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - description: Rows per page. The maximum differs per endpoint; see the schema.
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_VisitorPass_'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: List my visitor passes
      tags:
      - visitors
      x-user-stories:
      - coverage: served
        id: US-2.2
        role: The list the pre-approval flow returns to, split into current and history by a column the
          database computes
        title: Fast visitor pre-approval
    post:
      description: 'Mint a pass for an expected visitor. **Requires an active membership.**


        **`securityCode` and `passToken` appear in this response and nowhere else.**

        Both are stored as SHA-256 hashes; the plaintext is generated in the API,

        never sent to the database, and cannot be recovered by any endpoint. A

        resident who loses the code issues a new pass — the same trade the invite

        flow already makes, and the correct one for something that opens a gate.


        **The validity window is not accepted from the client.** It runs from

        `expectedAt` (or now) for the community''s `visitorCodeTtlMinutes` — the

        settings value that has been written since `0018` and read by nothing until

        this endpoint. A resident who could choose the window could mint a pass valid

        for a year.


        The status is `Expected`, not `Approved`: a pre-approved visitor has been

        announced, not approved by anybody. `Approved` is what answering a gate

        request produces, and a gate log needs to keep those apart.'
      operationId: create_visitor_pass_api_v1_visitor_passes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitorPassRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPassCreated'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Pre-approve a visitor
      tags:
      - visitors
      x-user-stories:
      - coverage: served
        id: US-2.2
        role: 'Pre-approval in one call: purpose, guest count and a security code returned exactly once,
          hashed at rest like an invite'
        title: Fast visitor pre-approval
  /api/v1/visitor-passes/{pass_id}:
    get:
      description: 'One pass — the QR screen''s read.


        A pass belonging to someone else is a `404`, identical to one that does not

        exist. **The QR payload is not reconstructible from this response**: the

        token it embeds was returned once at creation, so a client that did not keep

        it cannot rebuild the code from a later read.'
      operationId: get_visitor_pass_api_v1_visitor_passes__pass_id__get
      parameters:
      - description: Visitor pass id, scoped to the caller's own passes. Approve and reject additionally
          require the pass to be awaiting a decision, or the answer is 409.
        in: path
        name: pass_id
        required: true
        schema:
          title: Pass Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPass'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: One of my visitor passes
      tags:
      - visitors
      x-user-stories:
      - coverage: served
        id: US-2.2
        role: The QR screen's read. Carries no code and no token -- a pass read back cannot reconstruct
          the credential it was minted with
        title: Fast visitor pre-approval
  /api/v1/visitor-passes/{pass_id}/approve:
    post:
      description: 'Let in a visitor who arrived unannounced.


        Only from `Pending Approval` — the state the **gate** puts a pass in when

        somebody turns up asking for a flat. No endpoint in this repository creates

        one; the security app does, and it does not exist yet. This route is built

        now because it answers `visitor.approval_requested`, which is `US-2.1`''s

        recorded pain point, and a reply is the wrong thing to build after the

        notification that prompts it.


        Notifies the community''s `security` role, and its admins so that a community

        with nobody on security is not told nothing at all.'
      operationId: approve_visitor_pass_api_v1_visitor_passes__pass_id__approve_post
      parameters:
      - description: Visitor pass id, scoped to the caller's own passes. Approve and reject additionally
          require the pass to be awaiting a decision, or the answer is 409.
        in: path
        name: pass_id
        required: true
        schema:
          title: Pass Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPass'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Approve a gate request
      tags:
      - visitors
      x-user-stories:
      - coverage: partial
        id: US-2.1
        role: The resident's answer to a gate request, and the half of the story this backend can serve.
          Nothing here raises the request -- that is security software this repository does not contain
        title: Reliable visitor approval notifications
  /api/v1/visitor-passes/{pass_id}/cancel:
    post:
      description: 'Withdraw a pass that has not been used.


        **A pass whose guest is already inside cannot be cancelled** — `409`,

        `pass_already_used`. Once someone is through the gate, *cancel* is a

        physical-world operation and no database write performs it; a pass that

        flipped back would leave a record disagreeing with what happened, and the

        record is all anyone will have later. `PO`, 2026-08-04.


        The refusal is in the RPC rather than here, so it holds for every future

        caller and not only for this route.'
      operationId: cancel_visitor_pass_api_v1_visitor_passes__pass_id__cancel_post
      parameters:
      - description: Visitor pass id, scoped to the caller's own passes. Approve and reject additionally
          require the pass to be awaiting a decision, or the answer is 409.
        in: path
        name: pass_id
        required: true
        schema:
          title: Pass Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPass'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Cancel a visitor pass
      tags:
      - visitors
      x-user-stories:
      - coverage: served
        id: US-2.2
        role: 'Withdrawing a pass that has not been used. A guest already through the gate is a 409: cancel
          is a physical-world operation and no database write performs it'
        title: Fast visitor pre-approval
  /api/v1/visitor-passes/{pass_id}/reject:
    post:
      description: Turn away a visitor who arrived unannounced. Same states as `/approve`.
      operationId: reject_visitor_pass_api_v1_visitor_passes__pass_id__reject_post
      parameters:
      - description: Visitor pass id, scoped to the caller's own passes. Approve and reject additionally
          require the pass to be awaiting a decision, or the answer is 409.
        in: path
        name: pass_id
        required: true
        schema:
          title: Pass Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPass'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Reject a gate request
      tags:
      - visitors
      x-user-stories:
      - coverage: partial
        id: US-2.1
        role: The other answer. Stored as denied, shown as Rejected, and the gate is notified either way
        title: Reliable visitor approval notifications
  /health:
