          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Enddate
      - in: query
        name: amenityId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Amenityid
      - in: query
        name: bookingStatus
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookingstatus
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenityReport'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Amenity activity report
      tags:
      - amenities
