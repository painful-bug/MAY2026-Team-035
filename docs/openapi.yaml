        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Take an offered job
      tags:
      - worker-jobs
      x-user-stories:
      - coverage: served
        id: US-2.8
        role: The moment 'who is responsible' acquires an answer that came from the responsible person
          rather than from a supervisor guessing who was free
        title: Complaint accountability
      - coverage: served
        id: US-2.7
        role: The resident is told who is coming, by name, without asking
        title: Complaint lifecycle notifications
  /api/v1/worker/jobs/{work_order_id}/claim:
    post:
      description: "Claim, instantly. First come, first served — there is no approval step.\n\nRuling\
        \ C2: taking a job from the board commits the worker on the spot with\naccept-an-offer mechanics\
        \ — an `accepted` assignment, the job moved to\n`scheduled`, the resident and the supervisor notified.\
        \ Unlike `/accept`\nthere is no offer underneath: the RPC checks the roster, the trade and the\n\
        complaint's exclusion history itself, under the same row lock that settles\nthe race, so the loser\
        \ of a same-second double-claim is told *somebody has\nalready taken this job* rather than shown\
        \ a constraint violation.\n\nA job with no slot is claimed with no slot (C3): the overlap check\
        \ is\nskipped because there is nothing to overlap, the job still moves to\n`scheduled`, and the\
        \ hour is set afterwards in the supervisor's queue.\n\n| Status | Code | Cause |\n|---|---|---|\n\
        | 403 | `forbidden` | Not on this department's roster, or the wrong trade |\n| 404 | `not_found`\
        \ | No such job |\n| 409 | `conflict` | Somebody took it · the complaint's history rules you\n\
        \  out · you are booked during its slot |"
      operationId: claim_job_api_v1_worker_jobs__work_order_id__claim_post
      parameters:
      - in: path
        name: work_order_id
        required: true
        schema:
          title: Work Order Id
          type: string
      responses:
