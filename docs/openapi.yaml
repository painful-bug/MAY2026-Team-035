  /api/v1/push/subscriptions:
    post:
      description: 'Register the calling browser against the caller''s membership.


        The body is `PushSubscription.toJSON()` unchanged, so the frontend posts what

        the Push API handed it rather than transcribing it -- a transcription step is

        somewhere to put `auth` into the `p256dh` field, and that failure looks like

        a push that silently never decrypts.


        **Idempotent on `endpoint`.** The browser re-subscribes after every

        service-worker update and after any key rotation, and each of those refreshes

        the row rather than adding one. A repeat is a 200, not a 409: the client is

        describing a state, not creating a resource.'
      operationId: subscribe_api_v1_push_subscriptions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushSubscription'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionResult'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - HTTPBearer: []
      summary: Register a browser for push
      tags:
      - push
      x-no-user-story:
        api-type: Non-functional
        rationale: 'Web Push plumbing: handing the browser the application server key and storing what
          PushManager.subscribe hands back. A resident experiences US-2.1 and US-2.4; nobody experiences
          a VAPID key. See RESIDENT_BACKEND_DESIGN.md 10.5.'
        status: Not covered by user story
      x-user-stories: []
  /api/v1/push/subscriptions/unregister:
    post:
      description: 'Stop pushing to one browser.


        **The endpoint arrives in a body**, because a push endpoint URL is a device

        identifier: in a query string or a path segment it lands in every access log

        and proxy trace between here and the browser, for a request whose whole

        purpose is to stop tracking that device.


        **A removal that carries a body is a `POST` to a sub-path, not a `DELETE`.**

        RFC 9110 leaves content on a `DELETE` with no defined semantics -- clients

        may refuse to send it, intermediaries may strip it, and OpenAPI tooling

        warns on it -- so the one method whose body is guaranteed to arrive carries

        it instead. That is the second path this endpoint''s design always named as

        the remedy, chosen over a query parameter, which would have put the device

        identifier back in the logs.


        Always a 200, even when the row had already gone, and it works whether or not

        the server has a VAPID keypair. This is a resident turning notifications off:

        an error because the state was already reached, or because an operator lost a

        key, would leave them unable to do the one thing they asked for.'
      operationId: unsubscribe_api_v1_push_subscriptions_unregister_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnregisterPushSubscription'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionResult'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Unregister a browser
      tags:
      - push
      x-no-user-story:
        api-type: Non-functional
        rationale: 'Web Push plumbing: handing the browser the application server key and storing what
          PushManager.subscribe hands back. A resident experiences US-2.1 and US-2.4; nobody experiences
          a VAPID key. See RESIDENT_BACKEND_DESIGN.md 10.5.'
        status: Not covered by user story
      x-user-stories: []
  /api/v1/push/vapid-key:
    get:
      description: 'The public half of this server''s VAPID keypair.


        Public by construction -- that is what the pair is for -- but still behind a

        membership guard, because an unauthenticated endpoint that names your push

        key is free reconnaissance for no benefit.


        **A client must re-read this on load and compare it against the

        `applicationServerKey` its stored subscription was created with.** A

        subscription is bound to the key that created it, the protocol offers no

        dual-key period, and a rotation therefore stops push permanently and

        silently -- no error anywhere, pushes simply stop arriving.'
      operationId: vapid_key_api_v1_push_vapid_key_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - HTTPBearer: []
      summary: Public key for PushManager.subscribe
      tags:
      - push
      x-no-user-story:
        api-type: Non-functional
        rationale: 'Web Push plumbing: handing the browser the application server key and storing what
          PushManager.subscribe hands back. A resident experiences US-2.1 and US-2.4; nobody experiences
          a VAPID key. See RESIDENT_BACKEND_DESIGN.md 10.5.'
        status: Not covered by user story
      x-user-stories: []
  /api/v1/resident/snapshot:
    get:
      description: "Everything the resident home screen renders, in one call.\n\n**Takes no parameters.**\
        \ Tenancy is the resolved membership and the community\nit belongs to, so there is nothing a caller\
        \ could send that would widen what\ncomes back.\n\nEvery part is the same projection the screen\
        \ it links to would return —\n`ResidentInvoice`, `VisitorPass`, `ComplaintSummary`, `Notice`,\n\
        `NotificationItem` — so a bill on the home screen and the same bill on the\nPayments page can\
        \ never show different amounts.\n\nTwo things worth reading before wiring it up:\n\n* **The visitor\
        \ counts are guests, not passes.** One pass for a party of\n  twelve counts as twelve, which is\
        \ what the shipped screen does and what a\n  resident means by *how many people are coming*.\n\
        * **`dues.isPartialTotal`** says `outstandingTotal` was summed over as many\n  unpaid bills as\
        \ one read carries. It is false for any resident with a\n  normal number of them; when it is true,\
        \ the total is a lower bound and the\n  Payments page has the rest.\n\n`activity` is the caller's\
        \ notification feed. There is no second event log,\nand `unreadNotifications` counts the whole\
        \ feed rather than the five events\nreturned here — a badge drawn from the page would be wrong\
        \ the moment anybody\nscrolled.\n\n**Requires an active membership.** Not resident-only: a member\
        \ of staff who\nlives in the community has dues and visitors like anyone else, and the\naggregate\
        \ is theirs, not their department's."
      operationId: resident_snapshot_api_v1_resident_snapshot_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentSnapshot'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: The resident home aggregate
      tags:
      - resident-home
      x-user-stories:
      - coverage: partial
        id: US-2.3
        role: The one call the home screen needs, so a resident reaches their dues, their visitors and
          their complaints without navigating into each. The pending passes come back whole, which is
          what makes approving a visitor one tap rather than a journey
        title: One-tap quick access to frequent tasks
  /api/v1/settings:
    get:
      description: 'Everything the settings screen needs, in one request.


        ``hasSavedSettings`` is ``false`` for a community that has never saved. The

        values are then defaults rather than choices, and rendering the two the same

        way tells an admin they picked a timezone they have never seen.'
      operationId: get_settings_api_v1_settings_get
      responses:
