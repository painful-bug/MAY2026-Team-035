      - phone
      - flat
      - status
      - date
      - submittedAt
      title: RegistrationRequestSummary
      type: object
    RejectBookingRequest:
      description: '``reasonCode`` is one of ``BOOKING_REJECTION_REASONS``; ``reason`` carries

        the free text that ``other`` requires. A rejection with neither is an

        unanswerable support ticket, so the database refuses it too.'
      properties:
        notifyResident:
          default: true
