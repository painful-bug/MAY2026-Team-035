  /api/v1/resident/snapshot:
    get:
      description: "Everything the resident home screen renders, in one call.\n\n**Takes no parameters.**\
        \ Tenancy is the resolved membership and the community\nit belongs to, so there is nothing a caller\
        \ could send that would widen what\ncomes back.\n\nEvery part is the same projection the screen\
        \ it links to would return —\n`ResidentInvoice`, `VisitorPass`, `ComplaintSummary`, `Notice`,\n\
        `NotificationItem` — so a bill on the home screen and the same bill on the\nPayments page can\
