      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ComplaintCategorySummary_'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List complaint categories
      tags:
      - departments
  /api/v1/complaints:
