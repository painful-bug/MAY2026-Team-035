info:
  contact:
    name: HomeBandhu backend workstream, Team 035
    url: https://github.com/painful-bug/MAY2026-Team-035
  description: "Admin-dashboard backend for HomeBandhu, a FastAPI service over Supabase.\n\n## Reading\
    \ this document\n\nEvery operation carries four things beyond its request and response schemas:\n\n\
    * a **summary** and a **description** saying what it does and what is\n  surprising about it;\n* the\
    \ **error responses it can actually return**, derived by walking each\n  handler into its services\
    \ and repositories rather than assumed;\n* **`x-user-stories`**, tracing the operation back to the\
    \ team's requirements;\n* **`security`**, or its deliberate absence on the pre-authentication routes.\n\
    \n## Errors\n\nEvery failure returns one envelope, `ErrorResponse`:\n\n```json\n{\"error\": {\"code\"\
    : \"not_found\", \"message\": \"Department not found.\", \"details\": []}}\n```\n\nBranch on `error.code`,\
    \ never on `error.message`, which is prose and may be\nreworded. `details[]` appears only on `request_validation_error`\
    \ and lists the\noffending fields. This shape is emitted by all four handlers registered in\n`app/core/exceptions.py`,\
    \ including the catch-all, so a client needs exactly one\nerror path. Note that this is **not** FastAPI's\
    \ stock `{\"detail\": [...]}`: the\ndefault handlers are replaced.\n\n`404` is returned both for a\
    \ resource that does not exist and for one the caller\nmay not see. That ambiguity is deliberate --\
    \ a 404 must never confirm that\nanother community's data exists.\n\n## User stories\n\n`x-user-stories`\
    \ links an operation to the stories in\n`docs/product/USER_STORIES.md`, with the role it plays in\
    \ each and whether that\nstory is `served` or `partial`.\n\nAn operation that serves none carries\
    \ `x-no-user-story` instead, which states\n`Not covered by user story` and then classifies what the\
    \ operation is --\n`Feature`, `Functional`, `Configuration`, `Master data` or `Non-functional` --\n\
    with the reason. Absence of a story is therefore a recorded verdict rather than\nan omission, and\
    \ says what the operation *is* instead of only what it is not.\n\n`docs/API.md` section 16 is the\
    \ prose matrix, and is the only one of the two\nthat also names the stories **nothing** serves yet\
    \ -- a spec can only describe\nendpoints that exist.\n\n## Scope\n\nThis describes the admin-dashboard\
    \ build. `docs/product/USER_IDENTIFICATION.md`\nrecords one consequence worth knowing before reading\
    \ the traceability: staff\nhave no login, so every story written for a Facility or Security Manager\
    \ is\neither an administrator acting on their behalf or has no home here.\n"
  license:
    identifier: LicenseRef-coursework
    name: UNLICENSED
  summary: Backend for the HomeBandhu residential community platform.
  title: HomeBandhu API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/access-requests:
    post:
      description: 'Apply to join a community. Answers **201**.


        Four distinct refusals, deliberately separated: an unknown community is **404**; already being
        a member, or already having a request pending, is **409**; a rejected application inside the cool-off
        window is **409**; and a unit that belongs to a different community is **422**, because the request
        is coherent but the pairing is not.'
      operationId: create_access_request_api_v1_access_requests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Create Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/access-requests/mine:
    get:
      description: 'List the caller''s own join requests and their current status.


        Scoped to the caller by identity rather than by a parameter, so there is nothing here to tamper
        with.'
      operationId: my_access_requests_api_v1_access_requests_mine_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestListResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: My Access Requests
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/access-requests/{request_id}/withdraw:
    post:
      description: 'Withdraw a pending request.


        Only a request still pending can be withdrawn; anything already decided is **409**. Withdrawal
        is a status transition, not a deletion, so the community''s audit trail keeps the attempt.'
      operationId: withdraw_access_request_api_v1_access_requests__request_id__withdraw_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Withdraw Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests:
    get:
      description: 'The administrator''s review queue for the caller''s community.


        `status` defaults to `pending`, which is the screen''s default view; `limit` is capped at 100.
        Both are validated by pattern and range, so a bad filter is **422** rather than a silent empty
        page.'
      operationId: admin_access_requests_api_v1_admin_access_requests_get
      parameters:
      - description: 'Queue to show: `pending`, `approved`, `rejected` or `withdrawn`. Anything else is
          422 rather than an empty page.'
        in: query
        name: status
        required: false
        schema:
          default: pending
          pattern: ^(pending|approved|rejected|withdrawn)$
          title: Status
          type: string
      - description: Maximum rows to return (1-100).
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestListResponse'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Admin Access Requests
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests/{request_id}/approve:
    post:
      description: 'Approve a join request, creating the membership.


        Approving a request that is not pending is **409** -- which is what two administrators clicking
        the same row a second apart will get, and the reason the second one is not silently ignored.'
      operationId: approve_access_request_api_v1_admin_access_requests__request_id__approve_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Approve Access Request Api V1 Admin Access Requests  Request Id  Approve
                  Post
                type: object
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Approve Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests/{request_id}/blacklist:
    post:
      description: 'Reject a request and bar the applicant from re-applying.


        The difference from `reject` is only the cool-off: a blacklisted applicant has no expiry to wait
        out.'
      operationId: blacklist_access_request_api_v1_admin_access_requests__request_id__blacklist_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlacklistAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Blacklist Access Request Api V1 Admin Access Requests  Request Id  Blacklist
                  Post
                type: object
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Blacklist Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/access-requests/{request_id}/reject:
    post:
      description: 'Reject a join request, with a reason recorded against it.


        The applicant may apply again after the cool-off window; see `POST /access-requests`, which enforces
        it.'
      operationId: reject_access_request_api_v1_admin_access_requests__request_id__reject_post
      parameters:
      - description: Access-request id.
        in: path
        name: request_id
        required: true
        schema:
          title: Request Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAccessRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Reject Access Request Api V1 Admin Access Requests  Request Id  Reject
                  Post
                type: object
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Reject Access Request
      tags:
      - access requests
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admin/invitations:
    post:
      description: 'Issue a resident invitation, returning its code and link.


        The invite is bound to the email address given here. Redemption later checks that the verified
        identity signing in matches it, whichever provider it arrived through, which is why the address
        is required rather than optional.'
      operationId: create_invitation_api_v1_admin_invitations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Create Invitation
      tags:
      - invitations
      x-no-user-story:
        api-type: Feature
        rationale: Joining a community, and the admin review of those requests; the interviews were with
          people already in one.
        status: Not covered by user story
      x-user-stories: []
  /api/v1/admins:
    post:
      description: 'Give an existing community member the ``admin`` role.


        **This promotes, it does not invite.** The person must already be an active

        member of the caller''s community, matched by email. That is the flow

        ``roles.md`` describes -- *"Resident -> Committee members -> Admin"* -- and it

        is the only one available: the shared invitation contract hardcodes

        ``intended_role = ''resident''`` and exposes no role field, so an admin-bound

        invite cannot be minted without duplicating the token machinery this

        workstream does not own.


        Returns **404** when the email belongs to nobody in the community. The caller

        should invite them first (``POST /admin/invitations``), let them redeem, then

        promote. Returns **409** if they are already an admin.


        Only ``email`` is used. ``name``, ``phone``, ``tower`` and ``flat`` are

        accepted because the Admins screen sends them, but the member already has all

        four on their profile and residency, and letting a promotion silently rewrite

        someone''s flat would be a worse bug than ignoring the fields.'
      operationId: promote_admin_api_v1_admins_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteAdminRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSummary'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Promote a member to administrator
      tags:
      - people
      x-user-stories:
      - coverage: partial
        id: US-2.9
        role: Promotes an existing member, so the directory reflects who is actually in charge
        title: Verified management contact directory
  /api/v1/amenities/available:
    get:
      description: 'The amenities the caller may request a booking against.


        **"Available" means bookable in principle, not free right now.** Every

        amenity here exists, is active, and has no temporary closure recorded

        against it. Whether a particular slot is open is decided on write, under an

        advisory lock, by the booking guard -- a read endpoint that answered it

        would be describing a moment that had already passed by the time the

        resident submitted the form.


        The community is read from the caller''s active membership, resolved from

        Postgres. There is no community parameter, so there is nothing to tamper

        with.


        Returns the full catalogue in one response: `page` is always 1 and, for any

        community this product will plausibly see, `hasMore` is false. It is

        computed rather than asserted — a `true` means the catalogue has outgrown

        being unpaged and rows are being withheld, which no client could work out

        from the response otherwise. The `Page` envelope is kept so every collection

        on this API has one shape.'
      operationId: list_available_amenities_api_v1_amenities_available_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_BookableAmenity_'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: List bookable amenities
      tags:
      - amenities
      x-no-user-story:
        api-type: Feature
        rationale: 'Reading the amenity catalogue. The booking stories assume a resident already knows
          which amenity they are booking, so no interviewee described finding out -- in the building that
          is a noticeboard. The gap surfaced from the code instead: the resident booking write has always
          been unguarded while nothing let a resident learn an amenity id. See RESIDENT_BACKEND_DESIGN.md
          3.1.'
        status: Not covered by user story
      x-user-stories: []
  /api/v1/amenities/{amenity_id}/approvals:
    get:
      description: 'The approvals tab -- **one row per request, not per day**.


        The frontend produces one row per day and approves them one at a time, so a

        three-day request appears three times and can be approved on Monday and

        rejected on Tuesday. Here one decision covers the request, and ``dayCount``

        and ``dates`` say how much it covers.


        ``outstandingDues`` is the **flat''s** balance across its unpaid invoices. The

        frontend computes it per person; our invoices attach to the unit and carry no

        person, so it is the same label over a different number

        (DECISIONS_NEEDED E18).'
      operationId: list_approvals_api_v1_amenities__amenity_id__approvals_get
      parameters:
      - description: Amenity id. Must belong to the caller's community, or the answer is 404.
        in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      - description: pending | approved | rejected | cancelled | all
        in: query
        name: status
        required: false
        schema:
          default: pending
          description: pending | approved | rejected | cancelled | all
          title: Status
          type: string
      - description: 1-based page number.
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - description: Rows per page. The maximum differs per endpoint; see the schema.
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApprovalRequest_'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: List booking requests awaiting a decision
      tags:
      - amenities
      x-user-stories:
      - coverage: served
        id: US-1.5
        role: The approval queue
        title: Simplified booking management workflow
  /api/v1/amenities/{amenity_id}/blocks:
    post:
      description: 'Reserve a slot for maintenance or an association event.


        Always exclusive, whatever the amenity''s booking mode says: a hall closed for

        repairs is closed to everybody. Carries no flat and no charges.'
      operationId: block_slot_api_v1_amenities__amenity_id__blocks_post
      parameters:
      - description: Amenity id. Must belong to the caller's community, or the answer is 404.
        in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockSlotRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingSummary'
          description: Successful Response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - HTTPBearer: []
      summary: Block a slot administratively
      tags:
      - amenities
      x-user-stories:
      - coverage: served
        id: US-1.5
        role: Takes a slot out of circulation without inventing a fake booking
        title: Simplified booking management workflow
  /api/v1/amenities/{amenity_id}/bookings:
    get:
      description: 'The day timeline.


        ``state`` is the timeline''s vocabulary (''booked'' | ''blocked''); ``status`` is

        the lifecycle''s. The cleaning buffer is deliberately not sent as a block: the

        frontend synthesises buffers at render time from the booking''s end and the

        amenity''s buffer, and sending them too would give one block two sources.


        A booking whose end time has passed reads ``completed`` even though it is

        stored as ``approved`` -- that is a fact about the clock, not about the row.'
      operationId: list_amenity_bookings_api_v1_amenities__amenity_id__bookings_get
      parameters:
      - description: Amenity id. Must belong to the caller's community, or the answer is 404.
        in: path
        name: amenity_id
        required: true
        schema:
          title: Amenity Id
          type: string
      - description: Restrict to a single day (`YYYY-MM-DD`). Mutually exclusive with `from`/`to`.
        in: query
        name: date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
      - description: Start of an inclusive date range (`YYYY-MM-DD`).
        in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: From
      - description: End of an inclusive date range (`YYYY-MM-DD`).
        in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: To
      - description: Drop pending, rejected and cancelled days, matching what the timeline paints. Set
          false for the full history.
        in: query
        name: timelineOnly
        required: false
