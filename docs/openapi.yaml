    ResidentBookingRequest:
      description: 'A resident asking for one or more days of the same slot.


        Exists in an admin-scoped build because the approvals tab is otherwise a

        screen that can never have anything on it -- the same argument step 7 made

        for the invoice write endpoints.


        The flat is NOT a parameter: it is read from the caller''s own residency, so a

        resident cannot book against somebody else''s unit by editing a request.'
      properties:
        bookingTitle:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Bookingtitle
        dates:
          items:
            format: date
            type: string
          maxItems: 30
          minItems: 1
          title: Dates
          type: array
        endTime:
          title: Endtime
          type: string
        guestCount:
          default: 0
          maximum: 1000.0
          minimum: 0.0
          title: Guestcount
          type: integer
        guests:
          items:
            $ref: '#/components/schemas/GuestInput'
          title: Guests
          type: array
        isPrivateBooking:
          default: false
          title: Isprivatebooking
          type: boolean
        notes:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Notes
        startTime:
          title: Starttime
          type: string
      required:
      - dates
      - startTime
      - endTime
      title: ResidentBookingRequest
      type: object
