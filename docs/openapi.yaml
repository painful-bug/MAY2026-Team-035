          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List complaints
      tags:
      - complaints
  /api/v1/complaints/{complaint_id}:
