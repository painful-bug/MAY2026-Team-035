            type: string
          - type: 'null'
          title: Locationlabel
        longitude:
          anyOf:
          - maximum: 180.0
            minimum: -180.0
            type: number
          - type: 'null'
          title: Longitude
        phone:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
