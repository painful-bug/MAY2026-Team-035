                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Comment on a complaint
      tags:
      - complaints
  /api/v1/complaints/{complaint_id}/read:
    post:
      description: 'Clear the caller''s unread badge for this complaint.


        Read state is **per person**, not a flag on the complaint -- the frontend''s

        single `hasUnreadUpdate` boolean cannot represent an admin and a resident

        having seen different versions.'
      operationId: mark_read_api_v1_complaints__complaint_id__read_post
      parameters:
      - in: path
        name: complaint_id
        required: true
        schema:
          title: Complaint Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Mark a complaint as read
      tags:
      - complaints
  /api/v1/dashboard/admin:
    get:
      description: Counts for the admin home tiles, in one request instead of five.
      operationId: get_admin_dashboard_api_v1_dashboard_admin_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Admin home aggregate
      tags:
      - dashboard
  /api/v1/departments:
    get:
      description: 'Departments with their staff, category claims and complaint counts.


        ``activeComplaintCount`` and ``overdueComplaintCount`` are computed from the

        complaints actually routed to the department, so they agree with the

        complaints list rather than being re-derived per screen.'
      operationId: list_departments_api_v1_departments_get
      parameters:
      - description: Matches name, description, head, contact email, category names and staff names --
          the same fields the dashboard's search box covers.
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Matches name, description, head, contact email, category names and staff names
            -- the same fields the dashboard's search box covers.
          title: Q
      - description: Active | Inactive. Omit for both.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Active | Inactive. Omit for both.
          title: Status
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_DepartmentDetail_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List departments
      tags:
      - departments
    post:
      description: 'Create a department together with its categories, roster and head.


        All four in one transaction. ``categories`` are names: any that do not exist

        yet are created, because one of the two create screens is a free-text box.


        Returns 409 when the community already has a department with that name.'
      operationId: create_department_api_v1_departments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create a department
      tags:
      - departments
  /api/v1/departments/{department_id}:
    delete:
      description: 'Permanently remove a department, its category claims and its roster.


        **This one really is a delete**, unlike removing a resident. Complaint

        records survive with their department reference cleared, which is what the

        confirmation dialog promises.


        Returns 409 while the department owns any open complaint; the count is taken

        inside the deleting transaction, so a complaint raised mid-check cannot slip

        through. Deactivate instead.'
      operationId: delete_department_api_v1_departments__department_id__delete
      parameters:
      - in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete a department
      tags:
      - departments
    get:
      description: One department with its active roster and each member's open workload.
      operationId: get_department_api_v1_departments__department_id__get
      parameters:
      - in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get a department
      tags:
      - departments
    patch:
      description: 'Patch a department. Omitted fields are left unchanged.


        Two fields have collection semantics: sending ``categories`` replaces the

        claim set, and sending ``staff`` replaces the roster. Omitting either leaves

        it alone.


        Setting ``status`` to ``Inactive`` is the deactivation the dashboard offers

        instead of deletion, and is **not** blocked by open complaints -- that guard

        belongs to `DELETE` alone, or an admin with an unresolvable department would

        have no action left.'
      operationId: update_department_api_v1_departments__department_id__patch
      parameters:
      - in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update a department
      tags:
      - departments
  /api/v1/departments/{department_id}/staff:
    post:
      description: 'Add one person to a roster.


        A staff member needs no account: name is the only required field, matching

        what the department form actually collects.'
      operationId: add_staff_member_api_v1_departments__department_id__staff_post
      parameters:
      - in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMemberInput'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Add a staff member
      tags:
      - departments
    put:
      description: 'Reconcile the whole roster in one transaction.


        Entries carrying an ``id`` are updated in place, entries without one are

        added, and active members the payload omits are **deactivated, not deleted**

        -- a complaint''s ``assignee`` records staff by name, so removing the row

        would turn a past assignment into an unattributable string.


        PUT rather than POST because this replaces a collection: sending the same

        roster twice leaves the same result.'
      operationId: replace_staff_api_v1_departments__department_id__staff_put
      parameters:
      - in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceStaffRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StaffMember'
                title: Response Replace Staff Api V1 Departments  Department Id  Staff Put
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Replace a department's roster
      tags:
      - departments
  /api/v1/departments/{department_id}/staff/{staff_id}:
    delete:
      description: 'Take a member off the active roster.


        **Not a delete.** The row is marked inactive so past assignments recorded

        against their name stay explainable. Removing the head also frees the head

        slot in the same statement.'
      operationId: remove_staff_member_api_v1_departments__department_id__staff__staff_id__delete
      parameters:
      - in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      - in: path
        name: staff_id
        required: true
        schema:
          title: Staff Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Remove a staff member
      tags:
      - departments
    patch:
      description: 'Patch one roster entry.


        Promotion to head is not done here: ``PATCH /departments/{id}`` with a

        ``head`` name is the only path, because promoting one person has to demote

        the incumbent in the same transaction.'
      operationId: update_staff_member_api_v1_departments__department_id__staff__staff_id__patch
      parameters:
      - in: path
        name: department_id
        required: true
        schema:
          title: Department Id
          type: string
      - in: path
        name: staff_id
        required: true
        schema:
          title: Staff Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffMemberRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update a staff member
      tags:
      - departments
  /api/v1/invoices:
    get:
      description: 'The maintenance collections table, newest due date first.


        ``amount`` is what the flat was billed, not what it still owes -- the column

        is headed "Amount". ``outstanding`` carries the balance, and

        ``GET /invoices/summary`` is the authority on the totals: deriving them by

        summing this page gives the total of a page, not of the community.'
      operationId: list_invoices_api_v1_invoices_get
      parameters:
      - description: Matches the invoice title, its number, the flat code and the current resident's name
          -- the fields the collections search box covers.
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Matches the invoice title, its number, the flat code and the current resident's
            name -- the fields the collections search box covers.
          title: Q
      - description: Paid | Unpaid | Void | All. A partially paid invoice is Unpaid.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Paid | Unpaid | Void | All. A partially paid invoice is Unpaid.
          title: Status
      - in: query
        name: unitId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Unitid
      - description: maintenance | amenity | penalty | misc
        in: query
        name: invoiceType
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: maintenance | amenity | penalty | misc
          title: Invoicetype
      - in: query
        name: overdueOnly
        required: false
        schema:
          default: false
          title: Overdueonly
          type: boolean
      - in: query
        name: issuedFrom
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Issuedfrom
      - in: query
        name: issuedTo
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Issuedto
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_InvoiceSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List invoices
      tags:
      - money
    post:
      description: 'Issue one invoice against one flat.


        The invoice, its line items and its number are written in one transaction,

        and the totals are computed from the lines -- so a header that disagrees with

        its own contents cannot be submitted.


        The flat is identified by ``unitId`` or by ``flat`` (``B-1204``), and is

        created on first reference. Returns 409 when the lines total zero or the due

        date precedes the issue date.'
      operationId: create_invoice_api_v1_invoices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Issue an invoice
      tags:
      - money
  /api/v1/invoices/summary:
    get:
      description: 'The three tiles at the top of the Maintenance screen.


        Aggregated by Postgres over every invoice in the community, so the figures do

        not change when the list is paged. ``totalOutstanding`` sums the outstanding

        *balances*, so a partially paid invoice contributes only what is still owed.


        A community with no invoices reports zeros with HTTP 200, never a 404.'
      operationId: get_collection_summary_api_v1_invoices_summary_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSummaryDetail'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Collection totals
      tags:
      - money
  /api/v1/invoices/{invoice_id}:
    get:
      description: One invoice with its line items and every payment recorded against it.
      operationId: get_invoice_api_v1_invoices__invoice_id__get
      parameters:
      - in: path
        name: invoice_id
        required: true
        schema:
          title: Invoice Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get an invoice
      tags:
      - money
  /api/v1/invoices/{invoice_id}/payments:
    post:
      description: 'Record money received against an invoice and return the settled invoice.


        **Idempotent on ``reference``.** Sending the same reference twice returns the

        payment already recorded rather than crediting the invoice again, so a

        retried gateway webhook or a double-tapped Pay button cannot settle a bill

        twice.


        Returns 409 for an amount above the outstanding balance -- an overpayment is

        refused rather than clamped, because clamping accepts money and then loses

        it. Also 409 once the invoice has been voided.'
      operationId: record_payment_api_v1_invoices__invoice_id__payments_post
      parameters:
      - in: path
        name: invoice_id
        required: true
        schema:
          title: Invoice Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Record a payment
      tags:
      - money
  /api/v1/invoices/{invoice_id}/void:
    post:
      description: 'Cancel an invoice.


        **There is no DELETE for money.** The invoice, its lines and its number stay

        in place and are marked void -- an invoice number that vanishes is a gap

        somebody has to account for later.


        Returns 409 once any payment has succeeded against it: cancelling a bill

        somebody has already paid would strand their money against nothing.'
      operationId: void_invoice_api_v1_invoices__invoice_id__void_post
      parameters:
      - in: path
        name: invoice_id
        required: true
        schema:
          title: Invoice Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidInvoiceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Void an invoice
      tags:
      - money
  /api/v1/maintenance-runs:
    post:
      description: 'Issue one maintenance invoice per **occupied** flat for a billing period.


        **Safe to repeat.** A second run for the same period reports every flat as

        skipped and bills nobody; the guard is a partial unique index, so it holds

        even if two admins click at the same moment.


        The amount comes from ``billingSettings.defaultMaintenanceAmount`` unless

        overridden here. With neither set the call returns **409** rather than

        falling back to a number nobody chose -- the frontend''s hardcoded 4250 is a

        demo value and adopting it would bill a real community by accident.


        Vacant flats are not billed, because nothing in the product records who owns

        an empty one (DECISIONS_NEEDED A14).'
      operationId: run_maintenance_billing_api_v1_maintenance_runs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRunRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRunResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Run maintenance billing
      tags:
      - money
  /api/v1/notices:
    get:
      description: Published notices, newest first. Readable by any member of the community.
      operationId: list_notices_api_v1_notices_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_NoticeSummary_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List published notices
      tags:
      - dashboard
  /api/v1/payments:
    get:
      description: 'The collection log the Maintenance screen''s subtitle promises.


        Every payment received, newest first, across all invoices -- which is a

        different question from "what does this flat owe" and needs its own list.'
      operationId: list_payments_api_v1_payments_get
