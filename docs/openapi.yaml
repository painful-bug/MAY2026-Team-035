        rationale: 'The supervisor''s machinery for turning a triaged complaint into a scheduled visit:
          the queue, the job record, the edit and the assignment history. Three operations on this surface
          DO serve stories -- proposing a time, assigning a person and moving or cancelling a visit all
          reach the resident -- and these do not, which is the distinction worth keeping. The interviews
          produced ''nobody tells me what is happening''; they did not produce a work queue. What a resident
          learns from this machinery arrives through `GET /complaints`, the timeline and the schedule
          request, and claiming US-2.8 for a screen only the department can open would make the matrix
          say a resident sees something they cannot.'
        status: Not covered by user story
      x-user-stories: []
    post:
      description: 'Supervisor triage. **This is the fork the feature turns on.**


        Sending no `scheduledStartAt` creates a `draft`: the supervisor wants to ask

        the resident something first, and the conversation carries on in

        `POST /complaints/{id}/comments` exactly as it does today. Nothing is

        proposed and nobody is notified.


        Sending a slot proposes a visit. On a `resident` job that means

        `awaiting_resident` and a notification asking them to confirm; on a

        `facility` job there is nobody whose door is being knocked on, so it goes

        straight to `offered`.


        `departmentId` and `skillId` are both optional and both derived when

        omitted — the department from the complaint, the skill from the category

        (`0034` gave `complaint_categories` a `skill_id` precisely so nobody has to

        answer "which trade is this" twice). `priority` is not a field at all: a

        job''s urgency **is** the complaint''s urgency, and a second copy is a second

