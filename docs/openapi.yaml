      x-no-user-story:
        api-type: Feature
        rationale: 'A service person''s own calendar, leave and working week. Upstream of US-2.7 and US-2.8
          in the same way hiring is: the dispatch sweep reads these three tables to decide who can be
          offered a job, so a wrong answer here is a resident told nobody is available. But nobody described
          their own availability as a problem with their society, and claiming a share of a complaint
          story for a leave form would make the matrix say a resident sees something they cannot.'
        status: Not covered by user story
      x-user-stories: []
    post:
      description: 'Block out a window, in every community that employs the caller.


        **Overlapping blocks are allowed.** Two rows saying "not available" say the

        same thing rather than contradicting each other — the dispatch sweep reads

        them with `not exists` — and refusing them would refuse a perfectly sensible

        *away all week, especially Tuesday*.


        This does not cancel anything already accepted. A booking a resident has been

        told about is not retracted by a calendar edit; cancelling a scheduled visit

        is the supervisor''s act and carries its own notification.


        | Status | Code | Cause |

        |---|---|---|

        | 404 | `not_found` | You have not registered as a service provider |

        | 422 | `validation_error` | The block ends before it starts |'
      operationId: add_unavailability_api_v1_worker_unavailability_post
