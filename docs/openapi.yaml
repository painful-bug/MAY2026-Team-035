          default: 0
          title: Liveworkordercount
          type: integer
        location:
          default: ''
          title: Location
          type: string
        openRequestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Openrequestid
        priority:
          title: Priority
          type: string
        raisedBy:
          default: ''
          title: Raisedby
          type: string
        reopenedCount:
          default: 0
          title: Reopenedcount
          type: integer
        reroutedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Reroutedat
        returnedToPoolAt:
          anyOf:
