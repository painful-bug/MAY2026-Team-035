  /api/v1/billing-settings:
    get:
      description: 'The community''s billing configuration.


        ``defaultMaintenanceAmount`` is null until an admin sets one. There is no

        screen for this today and no value to migrate: the maintenance amount exists

        in the product only as a literal ``4250`` inside an approval handler

        (agenda item 12).'
      operationId: get_billing_settings_api_v1_billing_settings_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSettings'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get billing settings
      tags:
      - money
    put:
      description: 'Patch the billing configuration. Omitted fields are left unchanged.


        Sending ``defaultMaintenanceAmount: null`` clears the rate and stops billing

        runs until one is set again -- distinct from omitting the field, which leaves

        it as it was.


        ``invoiceNumberPrefix`` only affects numbers issued from now on. Invoices

        already issued keep the number they were given, because a number that changes

        is not an identifier.'
      operationId: update_billing_settings_api_v1_billing_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBillingSettingsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSettings'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update billing settings
      tags:
      - money
  /api/v1/communities/current:
    get:
      description: 'Return the community the caller belongs to.


        Open to any authenticated member, not admins only: the resident shell needs

        the community name in its header too.'
      operationId: get_current_community_api_v1_communities_current_get
